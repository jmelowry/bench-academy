<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8edf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench Academy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}[hidden]{display:none!important}img{max-width:100%}body{-webkit-tap-highlight-color:transparent}</style>
<title>Bench Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: a printed playmat in the middle, lesson/coach on the left, card inspector on the right (bottom sheet on phones). */
:root{
  --bg:#e8edf2; --mat:#d3dde7; --mat-2:#c5d1dd; --line:#8fa2b7; --surface:#f8fafc; --ink:#121a24; --muted:#536276;
  --accent:#e09a12; --accent-ink:#231600; --card:#fffdf7; --card-ink:#1b1f25; --danger:#c8382f; --ok:#2b8a4d; --poison:#7b43a8;
  --fire:#dc5430; --water:#2b7cc8; --grass:#3b984d; --lightning:#cfa20f; --colorless:#8a877f; --trainer:#4e7e86; --back:#304660;
  --f-display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --mat:#15222f; --mat-2:#1a2a3a; --line:#36516d; --surface:#17212c; --ink:#e6edf5; --muted:#94a5b9;
  --accent:#f2b33c; --accent-ink:#1f1400; --card:#f5f1e6; --card-ink:#1b1f25; --danger:#e0574d; --ok:#4fb874; --poison:#a873d6; --back:#2b3f58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --mat:#15222f; --mat-2:#1a2a3a; --line:#36516d; --surface:#17212c; --ink:#e6edf5; --muted:#94a5b9;
  --accent:#f2b33c; --accent-ink:#1f1400; --card:#f5f1e6; --card-ink:#1b1f25; --danger:#e0574d; --ok:#4fb874; --poison:#a873d6; --back:#2b3f58; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
.t-F{--t:var(--fire)} .t-W{--t:var(--water)} .t-G{--t:var(--grass)} .t-L{--t:var(--lightning)} .t-C{--t:var(--colorless)} .t-T{--t:var(--trainer)}
[class*="t-"]{--t-soft:color-mix(in srgb,var(--t) 20%,var(--card))}

.app{max-width:1380px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:14px}
.brand{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.brand .ei{width:26px;height:26px}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:3px}
nav{flex:1;min-width:0;overflow-x:auto;display:flex;gap:6px;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .chip.on .n{color:inherit;opacity:.7}
.chip.done .n::after{content:" ✓";color:var(--ok)} .chip.on.done .n::after{color:inherit}
.chip:focus-visible,.btn:focus-visible,.mini:focus-visible,.hc:focus-visible,.parts button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"lesson" "stage" "insp"}
@media (min-width:760px){.layout{grid-template-columns:290px minmax(0,1fr);grid-template-areas:"lesson stage" "insp stage";align-items:start}}
@media (min-width:1200px){.layout{grid-template-columns:300px minmax(0,1fr) 320px;grid-template-areas:"lesson stage insp"}}
#lesson{grid-area:lesson;min-width:0} #stage{grid-area:stage;min-width:0} #insp{grid-area:insp;min-width:0}

.panel{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:14px;padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:4px 0 10px;text-wrap:balance}
.panel p{margin:0 0 10px}
.panel p:last-child{margin-bottom:0}
.kbd{font-weight:700}
.goal{margin-top:14px;border:2px dashed var(--accent);border-radius:12px;padding:12px}
.goal.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.goal-h{font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.goal.ok .goal-h{color:var(--ok)}
.hint{font-size:13.5px;color:var(--muted)}
.goal-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sect{margin-top:16px}
.sect h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.coach{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.coach li{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:9px;padding:8px 10px;font-size:14px}
.check{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.check li{display:flex;gap:8px;align-items:center}
.check i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.check li.y i{background:var(--ok);border-color:var(--ok);color:#fff}
.check li.y i::after{content:"✓"}
.check small{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;max-height:230px;overflow:auto;font-size:13px;display:grid;gap:3px}
.log li{padding:3px 0 3px 9px;border-left:3px solid var(--line);color:var(--muted)}
.log li.w0{border-color:var(--fire);color:var(--ink)} .log li.w1{border-color:var(--grass);color:var(--ink)}

.art-wrap{position:relative;display:block;width:100%;height:100%}
.art-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rival{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.rival .pic{width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;border:3px solid var(--grass);background:color-mix(in srgb,var(--grass) 25%,var(--surface))}
.rival .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.rival b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.rival span{font-size:13px;color:var(--muted)}
.opp-hand{display:flex;align-items:center;gap:8px}
.opp-hand .av{width:24px;height:24px;border-radius:50%;overflow:hidden;border:2px solid var(--grass);flex:none;background:color-mix(in srgb,var(--grass) 25%,var(--surface))}
.opp-hand .av img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}

/* playmat */
.mat{background:var(--mat);border-radius:18px;padding:12px;position:relative;max-width:640px;margin:0 auto;
  background-image:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--line) 22%,transparent) 0 54px,transparent 55px);}
.side{display:grid;gap:8px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.2}
.row5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;align-items:end}
.bench{padding:6px;border:1.5px dashed var(--line);border-radius:12px}
.slot{aspect-ratio:5/7;border:1.5px dashed color-mix(in srgb,var(--line) 70%,transparent);border-radius:8px}
.zone{display:grid;gap:4px;min-width:0}
.active-zone .mini,.active-zone .slot{box-shadow:0 0 0 2px var(--mat),0 0 0 4px color-mix(in srgb,var(--line) 70%,transparent)}
.prizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px;border:1.5px dashed var(--line);border-radius:10px}
.cback{aspect-ratio:5/7;width:100%;border-radius:7px;border:2px solid color-mix(in srgb,var(--back) 70%,#fff);
  background:repeating-linear-gradient(45deg,var(--back) 0 5px,color-mix(in srgb,var(--back) 82%,#fff) 5px 10px)}
.cback.ghost{background:none;border-style:dashed;border-color:var(--line)}
.pile{position:relative}
.pile .count{position:absolute;inset:auto 0 6px;text-align:center;font-family:var(--f-display);font-size:18px;color:#fff;text-shadow:0 1px 2px #0008;font-variant-numeric:tabular-nums}
.pile .cback.ghost + .count{color:var(--muted);text-shadow:none}
.midline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;padding:8px 10px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.turnchip{font-family:var(--f-display);font-size:17px}
.turnchip.me{color:var(--fire)} .turnchip.opp{color:var(--grass)}
.mid-note{font-size:13px;color:var(--muted)}

/* mini card in play */
.mini{container-type:inline-size;position:relative;display:flex;flex-direction:column;aspect-ratio:5/7;width:100%;padding:0;cursor:pointer;
  border:2px solid color-mix(in srgb,var(--t) 75%,#000);border-radius:8px;background:var(--card);color:var(--card-ink);overflow:hidden;text-align:left}
.m-top{display:flex;align-items:center;gap:3cqw;padding:4cqw 5cqw 3cqw;background:var(--t-soft);font-family:var(--f-display);font-size:13cqw;line-height:1.05}
.m-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{font-family:var(--f-display);background:var(--card-ink);color:var(--card);border-radius:4px;padding:0 3px;font-size:.85em;line-height:1.2}
.m-art{display:block;height:34%} .m-art svg,.hc-art svg,.fc-art svg{display:block;width:100%;height:100%}
.m-hp{display:flex;align-items:baseline;gap:2cqw;padding:3cqw 5cqw 0;font-size:10cqw;font-variant-numeric:tabular-nums}
.m-hp b{font-family:var(--f-display);font-weight:400;font-size:17cqw;line-height:1}
.m-bar{margin:2cqw 5cqw 0;height:5cqw;border-radius:9px;background:color-mix(in srgb,var(--card-ink) 14%,transparent);overflow:hidden}
.m-bar i{display:block;height:100%;background:var(--ok)}
.m-bar i.lo{background:var(--danger)}
.m-en{display:flex;flex-wrap:wrap;gap:2cqw;padding:3cqw 5cqw;margin-top:auto}
.m-en .ei{width:15cqw;height:15cqw}
.dmgc{position:absolute;right:4cqw;top:24%;width:28cqw;height:28cqw;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:12cqw;box-shadow:0 1px 3px #0006}
.psn{position:absolute;left:4cqw;top:24%;background:var(--poison);color:#fff;font-size:8.5cqw;font-weight:700;border-radius:4px;padding:1cqw 3cqw;text-transform:uppercase;letter-spacing:.05em}
.mini.sel,.hc.sel{outline:3px solid var(--ink);outline-offset:2px}
.mini.tgt{outline:3px solid var(--accent);outline-offset:2px;animation:pulse 1.1s ease-in-out infinite}
.mini.hit{animation:hit .45s}
@keyframes pulse{50%{outline-offset:5px}}
@keyframes hit{20%{transform:translateX(-5%) rotate(-3deg)}50%{transform:translateX(5%) rotate(3deg)}80%{transform:translateX(-2%)}}
@media (prefers-reduced-motion:reduce){.mini.tgt,.mini.hit{animation:none}}

/* hand */
.handwrap{max-width:640px;margin:12px auto 0}
.hand{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.hand .empty{color:var(--muted);font-size:14px;padding:12px 0}
.hc{container-type:inline-size;flex:none;width:min(23vw,98px);aspect-ratio:5/7;display:flex;flex-direction:column;padding:0;cursor:pointer;text-align:left;
  border:2px solid color-mix(in srgb,var(--t) 75%,#000);border-radius:8px;background:var(--card);color:var(--card-ink);overflow:hidden}
.hc-kind{font-size:9.5cqw;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:4cqw 5cqw 0;color:color-mix(in srgb,var(--t) 70%,var(--card-ink))}
.hc-name{font-family:var(--f-display);font-size:13.5cqw;line-height:1.05;padding:1cqw 5cqw 3cqw;min-height:2.2em}
.hc-art{display:block;flex:1;min-height:0;background:var(--t-soft)}
.hc-foot{font-size:10cqw;padding:3cqw 5cqw;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.hc-foot .ei{width:14cqw;height:14cqw}

/* energy icon */
.ei{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--t);flex:none;vertical-align:middle;box-shadow:inset 0 -1px 0 #0003}
.ei svg{width:68%;height:68%;fill:#fff}

/* full card */
.fc{--pad:12px;color:var(--card-ink);background:linear-gradient(var(--t-soft),var(--card) 45%);border:3px solid color-mix(in srgb,var(--t) 80%,#000);border-radius:14px;padding:var(--pad);display:grid;gap:8px;max-width:340px;margin:0 auto}
.fc-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.stage{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card-ink);color:var(--card);border-radius:5px;padding:1px 6px}
.from{display:block;font-size:11px;color:color-mix(in srgb,var(--card-ink) 65%,transparent);margin-top:2px}
.fc-name{font-family:var(--f-display);font-size:23px;line-height:1.05;flex:1;min-width:0}
.fc-hp{font-family:var(--f-display);font-size:23px;font-variant-numeric:tabular-nums}
.fc-hp small{font-family:var(--f-body);font-size:11px;font-weight:700;margin-right:2px}
.fc-art{aspect-ratio:5/3;border-radius:8px;overflow:hidden;border:2px solid color-mix(in srgb,var(--t) 50%,var(--card))}
.fc-ability{background:color-mix(in srgb,#b23a48 12%,var(--card));border-radius:8px;padding:6px 8px;font-size:13px}
.ab-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#b23a48;color:#fff;border-radius:4px;padding:1px 5px}
.fc-ability p{margin:3px 0 0}
.fc-atk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid color-mix(in srgb,var(--card-ink) 15%,transparent)}
.cost{display:flex;gap:2px}
.atk-main b{font-size:16px}
.atk-text{display:block;font-size:12.5px;line-height:1.35}
.dmg{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.fc-rule{font-size:12px;border:1.5px solid color-mix(in srgb,var(--card-ink) 35%,transparent);border-radius:7px;padding:5px 8px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.fc-text{margin:0;font-size:14px}
.kindpill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--t);border-radius:5px;padding:2px 7px}
.fc-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:13px;border-top:1px solid color-mix(in srgb,var(--card-ink) 15%,transparent);padding-top:6px}
.fc-foot > span{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.fc-foot small{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:color-mix(in srgb,var(--card-ink) 60%,transparent);font-weight:700}
.fc-foot .val{display:flex;gap:2px;align-items:center;font-weight:700}
.part{border-radius:6px;transition:opacity .2s, box-shadow .2s}
.focus .part:not([data-hl]){opacity:.4}
[data-hl]{box-shadow:0 0 0 3px var(--accent);opacity:1}

/* inspector */
#insp{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:14px;padding:14px}
.insp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.insp-h b{font-family:var(--f-display);font-weight:400;font-size:19px}
.x{border:0;background:color-mix(in srgb,var(--line) 30%,transparent);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.acts{display:grid;gap:6px;margin-bottom:12px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer}
.act.go{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.act[disabled]{cursor:not-allowed;opacity:.75}
.act .why{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.act b{font-weight:700}
.act .num{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.status{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-bottom:10px;align-items:center}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.banner{border-left:4px solid var(--accent);padding:6px 10px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:0 10px 10px 0;margin-bottom:10px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.insp-empty p{margin:6px 0 0;color:var(--muted);font-size:14px}
@media (max-width:759px){
  #insp{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:62vh;overflow:auto;border-radius:18px 18px 0 0;
    padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -8px 30px #0004;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  #insp.open{transform:none;visibility:visible;transition:transform .25s ease}
  .app.sheet{padding-bottom:56vh}
}

/* anatomy */
.anat{max-width:820px;margin:0 auto}
.anat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.anat-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.anat-grid{grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.parts button{width:100%;text-align:left;display:block;border:1.5px solid color-mix(in srgb,var(--line) 70%,transparent);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer}
.parts button b{display:block;font-size:14px}
.parts button span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.parts button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.parts button.absent{opacity:.55}

#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,460px);box-shadow:0 6px 24px #0005;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(3px)}
.ov-box{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:22px;max-width:420px;width:100%}
.ov-box h2{font-size:34px}
</style>

</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="ei t-F" id="logo"></span><div>Bench Academy<small>Learn the Pokémon Trading Card Game by playing it</small></div></div>
    <nav id="nav" aria-label="Lessons"></nav>

</div>

<div id="ovl"></div>

<script>
const PRIZES = 4;
const TYPE = {
  F:{n:'Fire',     g:'M12 2.5c.6 3.4 4.8 5.6 4.8 10.6a4.8 4.8 0 0 1-9.6 0c0-2.6 1.6-4 2-6.4 1.4 1 2.4 2.6 2.4 4.4 1.2-2.4 1.4-5.6.4-8.6z'},
  W:{n:'Water',    g:'M12 3C9.2 7.8 6 11 6 15a6 6 0 0 0 12 0c0-4-3.2-7.2-6-12z'},
  G:{n:'Grass',    g:'M5 19C5 10.5 10.5 5 20 4c-.6 9.5-6 15-15 15zM5 19l8-8-1.2-.2z'},

const DEF = {
  cindlet:{kind:'pokemon',name:'Cindlet',stage:'Basic',type:'F',hp:60,weak:'W',retreat:1,
    attacks:[{name:'Ember Nip',cost:['F'],dmg:20}],art:{rx:13,ry:12,feat:'ears'}},
  pyrrox:{kind:'pokemon',name:'Pyrrox',stage:'Stage 1',from:'Cindlet',type:'F',hp:110,weak:'W',retreat:2,
    attacks:[{name:'Flare Rush',cost:['F','C'],dmg:60},{name:'Kindle Burst',cost:['F','F','C'],dmg:100,text:'Discard a Fire Energy from this Pokémon.',fx:'discardF'}],art:{rx:20,ry:17,feat:'ears'}},
  magmaw:{kind:'pokemon',name:'Magmaw ex',ex:true,stage:'Basic',type:'F',hp:190,weak:'W',retreat:3,
    attacks:[{name:'Scorch',cost:['F','C'],dmg:40},{name:'Magma Surge',cost:['F','F','F'],dmg:160,text:'This Pokémon also does 30 damage to itself.',fx:'self30'}],art:{rx:25,ry:19,feat:'spikes'}},
  puffkin:{kind:'pokemon',name:'Puffkin',stage:'Basic',type:'C',hp:70,weak:'L',retreat:1,
    ability:{name:'Tailwind Scout',text:'Once during your turn, if this Pokémon is on your Bench, you may draw a card.'},
    attacks:[{name:'Gust Tackle',cost:['C','C'],dmg:30}],art:{rx:18,ry:15,feat:'tuft'}},
  budling:{kind:'pokemon',name:'Budling',stage:'Basic',type:'G',hp:60,weak:'F',retreat:1,
    attacks:[{name:'Vine Whip',cost:['G'],dmg:20}],art:{rx:12,ry:11,feat:'leaf'}},
  thornoak:{kind:'pokemon',name:'Thornoak',stage:'Stage 1',from:'Budling',type:'G',hp:120,weak:'F',resist:'W',retreat:3,
    attacks:[{name:'Bramble Lash',cost:['G','C'],dmg:50},{name:'Toxic Thorn',cost:['G','G','C'],dmg:60,text:`Your opponent's Active Pokémon is now Poisoned.`,fx:'poison'}],art:{rx:22,ry:19,feat:'spikes'}},
  ripplet:{kind:'pokemon',name:'Ripplet',stage:'Basic',type:'W',hp:70,weak:'G',retreat:1,
    attacks:[{name:'Bubble Shot',cost:['W','C'],dmg:40}],art:{rx:16,ry:12,feat:'fin'}},
  stag:{kind:'pokemon',name:'Verdant Stag ex',ex:true,stage:'Basic',type:'G',hp:180,weak:'F',retreat:2,
    attacks:[{name:'Antler Charge',cost:['G','C'],dmg:50},{name:'Forest Fury',cost:['G','G','C'],dmg:140}],art:{rx:23,ry:18,feat:'antlers'}},
  potion:{kind:'item',name:'Potion',text:'Heal 30 damage from 1 of your Pokémon.'},
  switch:{kind:'item',name:'Switch',text:'Switch your Active Pokémon with 1 of your Benched Pokémon.'},
  fieldguide:{kind:'item',name:'Field Guide',text:'Search your deck for a Basic Pokémon, reveal it, and put it into your hand. Then shuffle your deck.'},
  research:{kind:'supporter',name:'Research Lead',text:'Draw 3 cards.'},
  fireE:{kind:'energy',name:'Fire Energy',type:'F'},
  grassE:{kind:'energy',name:'Grass Energy',type:'G'},
  waterE:{kind:'energy',name:'Water Energy',type:'W'}
};
for (const k in DEF) DEF[k].id = k;
const DECKS = {
  me:{cindlet:4,pyrrox:3,magmaw:1,puffkin:2,potion:2,switch:2,fieldguide:2,research:3,fireE:11},
  ai:{budling:4,thornoak:3,ripplet:2,stag:1,potion:2,fieldguide:2,research:3,grassE:9,waterE:4}
};

let UID = 0, GEN = 0, S;
const mk = id => ({uid:++UID,id});
const D = c => DEF[c.id];
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const build = list => shuffle(Object.entries(list).flatMap(([id,n]) => Array.from({length:n}, () => mk(id))));
const P = i => S.players[i];
const who = pi => pi===0 ? 'You' : 'Rival';
const topC = m => D(m.stack[m.stack.length-1]);
const hpLeft = m => Math.max(0, topC(m).hp - m.damage);
const inPlay = p => [p.active, ...p.bench].filter(Boolean);
const findMon = (p,uid) => inPlay(p).find(m => m.uid===uid);
const take = (p,uid) => { const i=p.hand.findIndex(c=>c.uid===uid); return i<0 ? null : p.hand.splice(i,1)[0]; };
const isBasic = c => D(c).kind==='pokemon' && D(c).stage==='Basic';
const ev = x => S.events.push(x);

function newPlayer(name, deck, isAI){
  return {name,isAI,deck,hand:[],discard:[],prizes:[],active:null,bench:[],turnsTaken:0,energyAttached:false,supporterPlayed:false,retreated:false};
}
function mkMon(card){ return {uid:card.uid,stack:[card],energy:[],damage:0,turnPlayed:S.turn,poisoned:false,abilityTurn:-1}; }
function log(m, w){ S.log.unshift({m,w}); if (S.log.length>80) S.log.pop(); }

/* ---------- art ---------- */
function eIcon(t){ return `<span class="ei t-${t}" title="${TYPE[t].n}"><svg viewBox="0 0 24 24"><path d="${TYPE[t].g}"/></svg></span>`; }
const ART = ['cindlet','pyrrox','magmaw','puffkin','budling','thornoak','ripplet','stag','potion','switch','fieldguide','research','fireE','grassE','waterE'];
function art(id){
  const svg = artSvg(id);
  if (!ART.includes(id)) return svg;
  return `<span class="art-wrap">${svg}<img src="art/${id}.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></span>`;
}
function artSvg(id){
  const d = DEF[id];
  const bg = `<rect width="100" height="60" fill="var(--t-soft)"/><circle cx="84" cy="8" r="22" fill="var(--t)" opacity=".16"/>`;
  if (d.kind==='energy') return `<svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${bg}<circle cx="50" cy="30" r="21" fill="var(--t)"/><g transform="translate(36 16) scale(1.17)"><path d="${TYPE[d.type].g}" fill="#fff"/></g></svg>`;
  if (d.kind!=='pokemon'){
    const ink = '#2a2f36';
    const icon = {
      potion:`<path d="M44 9h12v13l13 21a7 7 0 0 1-6 10H37a7 7 0 0 1-6-10l13-21z" fill="var(--card)" stroke="${ink}" stroke-width="2.4"/><path d="M35 40h30l3 5a5 5 0 0 1-4.5 7h-27A5 5 0 0 1 32 45z" fill="var(--t)"/><path d="M50 26v10M45 31h10" stroke="${ink}" stroke-width="2.4"/>`,
      switch:`<path d="M24 22h46l-9-8M76 38H30l9 8" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`,
      fieldguide:`<path d="M26 12h22a4 4 0 0 1 4 4v34a4 4 0 0 0-4-4H26zM74 12H52v38a4 4 0 0 1 4-4h18z" fill="var(--card)" stroke="${ink}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="63" cy="27" r="5" fill="none" stroke="var(--t)" stroke-width="2.6"/><path d="M66.5 30.5 70 34" stroke="var(--t)" stroke-width="2.6"/><path d="M31 22h14M31 28h14M31 34h10" stroke="${ink}" stroke-width="2"/>`,
      research:`<rect x="34" y="10" width="32" height="42" rx="3" fill="var(--card)" stroke="${ink}" stroke-width="2.4"/><rect x="43" y="7" width="14" height="7" rx="2" fill="var(--t)"/><path d="M40 24h20M40 31h20M40 38h13" stroke="${ink}" stroke-width="2.2"/>`
    }[id];
    return `<svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${bg}${icon}</svg>`;
  }
  const {rx,ry,feat} = d.art, cx = 50, cy = 51 - ry, er = Math.max(2.4, ry*.19), ex = rx*.38, ey = cy - ry*.12;
  let f = '';
  if (feat==='ears') f = `<path d="M${cx-rx*.75} ${cy-ry*.45} l${-rx*.2} ${-ry*.95} l${rx*.6} ${ry*.5}zM${cx+rx*.75} ${cy-ry*.45} l${rx*.2} ${-ry*.95} l${-rx*.6} ${ry*.5}z" fill="var(--t)"/>`;
  if (feat==='spikes') f = [-.55,0,.55].map(k=>`<path d="M${cx+k*rx-5} ${cy-ry*.82+Math.abs(k)*6} l5 -11 l5 11z" fill="color-mix(in srgb,var(--t) 70%,#000)"/>`).join('');
  if (feat==='tuft') f = [-.45,0,.45].map(k=>`<circle cx="${cx+k*rx}" cy="${cy-ry*.9}" r="${ry*.35}" fill="color-mix(in srgb,var(--t) 70%,#fff)"/>`).join('');
  if (feat==='leaf') f = `<path d="M${cx} ${cy-ry+1} c-2 -6 2 -11 10 -12 c-1 8 -5 12 -10 12z" fill="color-mix(in srgb,var(--t) 75%,#fff)"/><path d="M${cx} ${cy-ry+1} v-5" stroke="var(--t)" stroke-width="2"/>`;
  if (feat==='fin') f = `<path d="M${cx-6} ${cy-ry+3} q6 -16 14 -10 q-4 4 -2 12z" fill="color-mix(in srgb,var(--t) 70%,#fff)"/>`;
  if (feat==='antlers') f = [-1,1].map(s=>`<path d="M${cx+s*rx*.45} ${cy-ry*.75} l${s*6} -12 m${-s*3} 6 l${s*-6} -6 m${s*6} 0 l${s*7} -4" stroke="color-mix(in srgb,var(--t) 55%,#5b3a1a)" stroke-width="2.6" fill="none" stroke-linecap="round"/>`).join('');
  const eyes = [-1,1].map(s=>`<circle cx="${cx+s*ex}" cy="${ey}" r="${er}" fill="#fff"/><circle cx="${cx+s*ex+.5}" cy="${ey+.4}" r="${er*.55}" fill="#1d1d1d"/>`).join('');
  const ring = d.ex ? `<ellipse cx="${cx}" cy="${cy}" rx="${rx+6}" ry="${ry+6}" fill="none" stroke="var(--t)" stroke-width="1.6" stroke-dasharray="2 3" opacity=".7"/>` : '';
  return `<svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${bg}<ellipse cx="50" cy="55" rx="34" ry="5" fill="var(--t)" opacity=".22"/>${ring}${f}<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="var(--t)"/><ellipse cx="${cx}" cy="${cy+ry*.4}" rx="${rx*.55}" ry="${ry*.4}" fill="#fff" opacity=".22"/>${eyes}</svg>`;
}

/* ---------- full card ---------- */
function fullCard(id){
  const d = DEF[id];
  if (d.kind==='pokemon') return `
  <div class="fc t-${d.type}">
    <div class="fc-head">
      <span class="part" data-part="stage"><span class="stage">${d.stage}</span>${d.from?`<span class="from">Evolves from ${d.from}</span>`:''}</span>
      <span class="part fc-name" data-part="name">${d.name}</span>
      <span class="part fc-hp" data-part="hp"><small>HP</small>${d.hp}</span>
      <span class="part" data-part="type">${eIcon(d.type)}</span>
    </div>
    <div class="fc-art">${art(id)}</div>
    ${d.ability?`<div class="part fc-ability" data-part="ability"><span class="ab-tag">Ability</span> <b>${d.ability.name}</b><p>${d.ability.text}</p></div>`:''}
    ${d.attacks.map(a=>`<div class="fc-atk">
      <span class="part cost" data-part="cost">${a.cost.map(eIcon).join('')}</span>
      <span class="atk-main"><b>${a.name}</b>${a.text?`<span class="part atk-text" data-part="text">${a.text}</span>`:''}</span>
      <span class="part dmg" data-part="damage">${a.dmg||''}</span></div>`).join('')}
    ${d.ex?`<div class="part fc-rule" data-part="rule"><b>Pokémon ex rule:</b> When your Pokémon ex is Knocked Out, your opponent takes 2 Prize cards.</div>`:''}
    <div class="fc-foot">
      <span class="part" data-part="weakness"><small>Weakness</small><span class="val">${d.weak?eIcon(d.weak)+'×2':'—'}</span></span>
      <span class="part" data-part="resistance"><small>Resistance</small><span class="val">${d.resist?eIcon(d.resist)+'−30':'—'}</span></span>
      <span class="part" data-part="retreat"><small>Retreat</small><span class="val">${d.retreat?Array(d.retreat).fill(eIcon('C')).join(''):'—'}</span></span>
    </div>
  </div>`;
  if (d.kind==='energy') return `
  <div class="fc t-${d.type}">
    <div class="fc-head"><span class="part kindpill" data-part="kind">Basic Energy</span><span class="part fc-name" data-part="name">${d.name}</span><span class="part" data-part="type">${eIcon(d.type)}</span></div>
    <div class="fc-art">${art(id)}</div>
    <div class="part fc-rule" data-part="rule">Attach 1 Energy card from your hand to 1 of your Pokémon once per turn. It provides 1 ${TYPE[d.type].n} Energy.</div>
  </div>`;
  return `
  <div class="fc t-T">
    <div class="fc-head"><span class="part kindpill" data-part="kind">Trainer · ${d.kind==='item'?'Item':'Supporter'}</span></div>
    <span class="part fc-name" data-part="name">${d.name}</span>
    <div class="fc-art">${art(id)}</div>
    <p class="part fc-text" data-part="text">${d.text}</p>
    <div class="part fc-rule" data-part="rule">${d.kind==='item'?'You may play any number of Item cards during your turn.':'You may play only 1 Supporter card during your turn.'}</div>
  </div>`;
}

/* ---------- rules ---------- */
function canPay(en, cost){
  const pool = {}; en.forEach(e => { const t=D(e).type; pool[t]=(pool[t]||0)+1; });
  let left = en.length;
  for (const t of cost) if (t!=='C'){ if (!pool[t]) return false; pool[t]--; left--; }
  return left >= cost.filter(t=>t==='C').length;
}
function costText(cost){ const n={}; cost.forEach(t=>n[t]=(n[t]||0)+1); return Object.entries(n).map(([t,k])=>`${k} ${TYPE[t].n}`).join(' + '); }
function calcDamage(att, def, atk){
  let d = atk.dmg||0; const notes = [];
  if (!d || !def) return {d, notes};
  if (topC(def).weak===topC(att).type){ d*=2; notes.push('Weakness ×2'); }
  if (topC(def).resist===topC(att).type){ d=Math.max(0,d-30); notes.push('Resistance −30'); }
  return {d, notes};
}
function whyNotBench(pi,c){
  const p=P(pi);
  if (!isBasic(c)) return 'Only Basic Pokémon can be played from your hand. Evolution cards go on top of a Pokémon already in play.';
  if (p.active && p.bench.length>=5) return 'Your Bench is full. You can have at most 5 Benched Pokémon.';
  return '';
}
function whyNotAttach(pi){
  if (S.setup) return `You can't attach Energy during setup.`;
  if (P(pi).energyAttached) return 'You already attached an Energy this turn. You get one attachment per turn.';
  return '';
}
const evoTargets = (pi,c) => inPlay(P(pi)).filter(m => topC(m).name===D(c).from);
function whyNotEvolve(pi,c,m){
  const p=P(pi);
  if (S.setup) return `You can't evolve during setup. Evolution cards wait in your hand until the game starts.`;
  if (p.turnsTaken<2) return `Neither player can evolve on their first turn.`;
  if (m && topC(m).name!==D(c).from) return `${D(c).name} evolves from ${D(c).from}, not ${topC(m).name}.`;
  if (m && m.turnPlayed>=S.turn) return `${topC(m).name} came into play or evolved this turn. Wait until your next turn to evolve it.`;
  return '';
}
function whyNotTrainer(pi,c){
  const d=D(c), p=P(pi);
  if (S.setup) return `Trainer cards can't be played during setup.`;
  if (d.kind==='supporter'){
    if (p.supporterPlayed) return 'You already played a Supporter this turn. Only one per turn.';
    if (S.turn===1) return `The player who goes first can't play a Supporter on their first turn.`;
  }
  if (d.id==='potion' && !inPlay(p).some(m=>m.damage>0)) return 'None of your Pokémon have damage to heal.';
  if (d.id==='switch' && !p.bench.length) return 'You need a Benched Pokémon to switch with.';
  if (d.id==='fieldguide' && !p.deck.some(isBasic)) return 'There are no Basic Pokémon left in your deck.';
  if (d.id==='research' && !p.deck.length) return 'Your deck is empty.';
  return '';
}
function whyNotRetreat(pi){
  const p=P(pi), a=p.active;
  if (S.setup) return 'Finish setup first.';
  if (p.retreated) return 'You already retreated this turn. You can retreat once per turn.';
  if (!p.bench.length) return 'You need a Benched Pokémon to take its place.';
  if (a.energy.length<topC(a).retreat) return `Retreating ${topC(a).name} costs ${topC(a).retreat} Energy and it has ${a.energy.length}.`;
  return '';
}
function whyNotAttack(pi,i){
  const a=P(pi).active, atk=topC(a).attacks[i];
  if (S.setup) return 'Finish setup first.';
  if (S.turn===1) return `The player who goes first can't attack on their first turn.`;
  if (!canPay(a.energy, atk.cost)) return `Needs ${costText(atk.cost)} Energy. ${topC(a).name} has ${a.energy.length?costText(a.energy.map(e=>D(e).type)):'none'}.`;
  return '';
}
function whyNotAbility(pi,m){
  if (S.setup) return 'Finish setup first.';
  if (P(pi).active===m) return 'Tailwind Scout only works while this Pokémon is on your Bench.';
  if (m.abilityTurn===S.turn) return 'This Puffkin already used Tailwind Scout this turn.';
  if (!P(pi).deck.length) return 'Your deck is empty.';
  return '';
}

/* ---------- actions ---------- */
function doBench(pi,cuid){
  const p=P(pi), c=take(p,cuid), m=mkMon(c);
  if (!p.active){ p.active=m; log(`${who(pi)} put ${D(c).name} in the Active Spot.`,pi); ev('active'); }
  else { p.bench.push(m); log(`${who(pi)} benched ${D(c).name}.`,pi); ev('bench'); }
  return m;
}
function doAttach(pi,cuid,muid){
  const p=P(pi), m=findMon(p,muid), c=take(p,cuid);
  m.energy.push(c); p.energyAttached=true;
  log(`${who(pi)} attached ${D(c).name} to ${topC(m).name}.`,pi); ev('attach');
}
function doEvolve(pi,cuid,muid){
  const p=P(pi), m=findMon(p,muid), c=take(p,cuid), old=topC(m).name;
  m.stack.push(c); m.turnPlayed=S.turn; m.poisoned=false;
  log(`${who(pi)} evolved ${old} into ${D(c).name}. It keeps its Energy and damage.`,pi); ev('evolve');
}
function doTrainer(pi,cuid,arg){
  const p=P(pi), c=take(p,cuid), d=D(c);
  p.discard.push(c);
  if (d.kind==='supporter'){ p.supporterPlayed=true; ev('supporter'); }
  if (d.id==='potion'){ const m=findMon(p,arg), h=Math.min(30,m.damage); m.damage-=h; log(`${who(pi)} played Potion and healed ${h} damage from ${topC(m).name}.`,pi); ev('potion'); }
  if (d.id==='switch'){ const k=p.bench.findIndex(m=>m.uid===arg), old=p.active; old.poisoned=false; p.active=p.bench[k]; p.bench[k]=old;
    log(`${who(pi)} played Switch. ${topC(p.active).name} is now Active and ${topC(old).name} went to the Bench.`,pi); ev('switch'); }
  if (d.id==='fieldguide'){ const k=p.deck.findIndex(x=>x.id===arg), [b]=p.deck.splice(k,1); p.hand.push(b); shuffle(p.deck);
    log(`${who(pi)} played Field Guide and took ${D(b).name} from the deck.`,pi); ev('item'); }
  if (d.id==='research'){ const n=Math.min(3,p.deck.length); for (let i=0;i<n;i++) p.hand.push(p.deck.pop());
    log(`${who(pi)} played Research Lead and drew ${n} cards.`,pi); }
}
function doRetreat(pi,buid){
  const p=P(pi), a=p.active, n=topC(a).retreat;
  p.discard.push(...a.energy.splice(a.energy.length-n, n));
  a.poisoned=false;
  const k=p.bench.findIndex(m=>m.uid===buid); p.active=p.bench[k]; p.bench[k]=a; p.retreated=true;
  log(`${who(pi)} retreated ${topC(a).name}, discarding ${n} Energy. ${topC(p.active).name} is now Active.`,pi); ev('retreat');
}
function doAbility(pi,muid){
  const p=P(pi), m=findMon(p,muid); m.abilityTurn=S.turn;
  const c=p.deck.pop(); p.hand.push(c);
  log(`${who(pi)} used Tailwind Scout and drew ${pi===0?D(c).name:'a card'}.`,pi); ev('ability');
}
function doPromote(pi,buid){
  const p=P(pi), k=p.bench.findIndex(m=>m.uid===buid);
  p.active=p.bench.splice(k,1)[0];
  log(`${who(pi)} moved ${topC(p.active).name} into the Active Spot.`,pi);
}
function aiPromote(){
  const p=P(1);
  const best=[...p.bench].sort((a,b)=>(b.energy.length*25+hpLeft(b))-(a.energy.length*25+hpLeft(a)))[0];
  doPromote(1,best.uid);
}
function doAttack(pi,i){
  const p=P(pi), o=P(1-pi), a=p.active, d=o.active, atk=topC(a).attacks[i];
  const r=calcDamage(a,d,atk);
  d.damage+=r.d; S.hit=d.uid;
  log(`${topC(a).name} used ${atk.name} on ${topC(d).name} for ${r.d} damage${r.notes.length?` (${r.notes.join(', ')})`:''}.`,pi);
  if (atk.fx==='discardF'){ const k=a.energy.findIndex(e=>D(e).type==='F'); if (k>=0){ p.discard.push(...a.energy.splice(k,1)); log(`${topC(a).name} discarded a Fire Energy.`,pi);} }
  if (atk.fx==='self30'){ a.damage+=30; log(`${topC(a).name} also did 30 damage to itself.`,pi); }
  if (atk.fx==='poison' && d.damage<topC(d).hp){ d.poisoned=true; log(`${topC(d).name} is now Poisoned.`,pi); }
  ev('attack:'+atk.name); ev('attackBy:'+topC(a).name);
  clearUI();
  resolveAfterDamage(() => endTurn());
}
function knockOut(pi,m){
  const p=P(pi), o=P(1-pi), t=topC(m);
  p.discard.push(...m.stack, ...m.energy);
  if (p.active===m) p.active=null; else p.bench=p.bench.filter(x=>x!==m);
  const n=Math.min(t.ex?2:1, o.prizes.length);
  for (let i=0;i<n;i++) o.hand.push(o.prizes.pop());
  log(`${t.name} was Knocked Out! ${who(1-pi)} took ${n} Prize card${n>1?'s':''}${t.ex?' (Pokémon ex give up 2)':''}.`);
  ev('ko'); if (pi===1) ev('myko');
}
function checkWin(){
  const W=(pi,why)=>{ S.over={winner:pi,why}; S.busy=false; clearUI(); log(why); return true; };
  for (const pi of [0,1]) if (!P(pi).prizes.length) return W(pi, pi===0?'You took your last Prize card.':'The Rival took their last Prize card.');
  for (const pi of [0,1]) if (!P(pi).active && !P(pi).bench.length) return W(1-pi, pi===0?'You have no Pokémon left in play.':'The Rival has no Pokémon left in play.');
  return false;
}
function resolveAfterDamage(next){
  for (const pi of [S.cur,1-S.cur]) for (const m of inPlay(P(pi))) if (m.damage>=topC(m).hp) knockOut(pi,m);
  if (checkWin()){ render(); return; }
  if (!P(1).active && P(1).bench.length) aiPromote();
  if (!P(0).active && P(0).bench.length){ S.ui={sel:null,mode:'promote',data:null}; S.after=next; S.busy=false; render(); return; }
  next();
}
function endTurn(){
  clearUI();
  if (S.mode==='lesson'){ S.locked=true; render(); return; }
  for (const pi of [0,1]){ const a=P(pi).active; if (a && a.poisoned){ a.damage+=10; log(`Pokémon Checkup: ${topC(a).name} took 10 Poison damage.`); } }
  resolveAfterDamage(() => startTurn(1-S.cur));
}
function startTurn(pi){
  S.cur=pi; S.turn++;
  const p=P(pi); p.turnsTaken++; p.energyAttached=p.supporterPlayed=p.retreated=false;
  if (!p.deck.length){ S.over={winner:1-pi,why:`${pi===0?'You':'The Rival'} had no cards left to draw at the start of the turn.`}; render(); return; }
  const c=p.deck.pop(); p.hand.push(c);
  log(pi===0?`Your turn ${S.turn}. You drew ${D(c).name}.`:`Rival's turn ${S.turn}. They drew a card.`, pi);
  render();
  if (p.isAI) runAI();
}

/* ---------- rival AI ---------- */
function aiEnergyTarget(p){
  const need = m => topC(m).attacks.some(a => !canPay(m.energy,a.cost));
  if (need(p.active)) return p.active;
  return [...p.bench].sort((a,b)=>topC(b).hp-topC(a).hp).find(need) || null;
}
async function runAI(){
  const g=S.gen, p=P(1);
  S.busy=true; render();
  const step = async () => { render(); await sleep(700); return S.gen===g && !S.over; };
  if (!await step()) return;
  if (S.turn!==1 && !p.supporterPlayed){ const r=p.hand.find(c=>c.id==='research'); if (r && p.hand.length<=5 && p.deck.length>6){ doTrainer(1,r.uid); if (!await step()) return; } }
  let fg;
  while ((fg=p.hand.find(c=>c.id==='fieldguide')) && p.deck.some(isBasic) && p.bench.length<4){ doTrainer(1,fg.uid,p.deck.find(isBasic).id); if (!await step()) return; }
  for (const c of p.hand.filter(isBasic)) if (p.bench.length<5){ doBench(1,c.uid); if (!await step()) return; }
  for (const c of p.hand.filter(c=>D(c).stage==='Stage 1')){ const t=inPlay(p).find(m=>!whyNotEvolve(1,c,m)); if (t){ doEvolve(1,c.uid,t.uid); if (!await step()) return; } }
  const pot=p.hand.find(c=>c.id==='potion');
  if (pot && p.active.damage>=30){ doTrainer(1,pot.uid,p.active.uid); if (!await step()) return; }
  const en=p.hand.filter(c=>D(c).kind==='energy');
  if (en.length && !p.energyAttached){ const t=aiEnergyTarget(p); if (t){ const e=en.find(c=>D(c).type===topC(t).type)||en[0]; doAttach(1,e.uid,t.uid); if (!await step()) return; } }
  const canHit = m => topC(m).attacks.some(a=>canPay(m.energy,a.cost));
  if (!p.retreated && p.bench.length && !canHit(p.active) && p.active.energy.length>=topC(p.active).retreat){
    const ready=p.bench.find(canHit); if (ready){ doRetreat(1,ready.uid); if (!await step()) return; }
  }
  S.busy=false;
  if (S.turn!==1){
    const a=p.active; let best=-1, bd=-1;
    topC(a).attacks.forEach((atk,i)=>{ if (canPay(a.energy,atk.cost)){ const d=calcDamage(a,P(0).active,atk).d; if (d>bd){bd=d;best=i;} } });
    if (best>=0){ doAttack(1,best); return; }
  }
  log('Rival ended their turn.',1);
  endTurn();
}

/* ---------- lessons ---------- */
function scenario(o){
  S.turn = 5;
  const me=newPlayer('You', build({fireE:6,cindlet:2,potion:2,research:2}), false);
  const op=newPlayer('Rival', build({grassE:6,budling:3,research:3}), true);
  me.turnsTaken=op.turnsTaken=3;
  S.players=[me,op];
  const place = s => { const m=mkMon(mk(s.id)); if (s.under) m.stack.unshift(mk(s.under)); m.turnPlayed=0;
    (s.energy||[]).forEach(e=>m.energy.push(mk(e))); m.damage=s.damage||0; m.poisoned=!!s.poisoned; return m; };
  me.active = o.me.active ? place(o.me.active) : null;
  me.bench = (o.me.bench||[]).map(place);
  op.active = place(o.op.active);
  op.bench = (o.op.bench||[]).map(place);
  me.hand = (o.hand||[]).map(mk);
  me.prizes = Array.from({length:o.mePrizes??PRIZES}, ()=>mk('fireE'));
  op.prizes = Array.from({length:PRIZES}, ()=>mk('grassE'));
  S.setup = !!o.setup; S.cur = 0;
}

function loadDone(){ try { return new Set(JSON.parse(localStorage.getItem('bench-academy-done')||'[]')); } catch(e){ return new Set(); } }
function saveDone(set){ try { localStorage.setItem('bench-academy-done', JSON.stringify([...set])); } catch(e){} }
const DONE = loadDone();

function blank(li){ return {gen:++GEN,li,mode:'lesson',players:[],cur:0,turn:5,ui:{sel:null,mode:null,data:null},log:[],events:[],over:null,overHidden:false,busy:false,locked:false,setup:false,after:null,done:false,part:'hp',partsSeen:new Set(),acard:'pyrrox',hit:null}; }
function goLesson(i){
  i=Math.max(0,Math.min(LESSONS.length-1,i));
  S=blank(i);
  const L=LESSONS[i];
  if (L.kind==='match'){ S.mode='match'; startMatch(); }
  else if (L.build) L.build();
  render();
  if (window.innerWidth<760) document.getElementById('lesson').scrollIntoView({block:'start'});
}
function startMatch(){
  S.turn=0;
  const me=newPlayer('You',build(DECKS.me),false), op=newPlayer('Rival',build(DECKS.ai),true);
  S.players=[me,op];
  [me,op].forEach((p,pi)=>{
    let mull=0;
    for(;;){ p.deck.push(...p.hand); p.hand=[]; shuffle(p.deck); p.hand=p.deck.splice(-7); if (p.hand.some(isBasic)) break; mull++; }
    if (mull) log(`${who(pi)} had no Basic Pokémon and took ${mull} mulligan${mull>1?'s':''}: reshuffled and drew 7 again.`, pi);
    p.prizes=p.deck.splice(-PRIZES);
  });
  const basics=op.hand.filter(isBasic).sort((a,b)=>D(a).hp-D(b).hp);
  op.active=mkMon(take(op,basics.pop().uid));
  for (const c of basics) if (op.bench.length<5) op.bench.push(mkMon(take(op,c.uid)));
  S.setup=true; S.cur=0;
  log(`Both players drew 7 cards and set aside ${PRIZES} Prize cards. The Rival has placed their Pokémon. Choose your Active Pokémon.`);
}
function checkLesson(){
  const L=LESSONS[S.li];
  if (S.mode!=='lesson' || S.done || !L.check) return;
  if (L.check()){ S.done=true; DONE.add(L.key); saveDone(DONE); setTimeout(()=>toast('Goal complete. Nice!'),50); }
}

/* ---------- UI ---------- */
function clearUI(){ S.ui={sel:null,mode:null,data:null}; }
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }

function isTarget(owner,m){
  const mode=S.ui.mode, p=P(0);
  if (!mode || owner!==0) return false;
  const onBench = p.bench.includes(m);
  if (mode==='attach') return true;
  if (mode==='evolve'){ const c=p.hand.find(x=>x.uid===S.ui.data); return c && !whyNotEvolve(0,c,m); }
  if (mode==='potion') return m.damage>0;
  return ['switch','retreat','promote'].includes(mode) && onBench;
}

function actBtn(a, label, why, extra='', num='', go=false){

function handActions(c){
  const d=D(c), p=P(0);
  if (S.mode==='match' && !S.setup && S.cur!==0) return '';
  if (d.kind==='pokemon'){
    if (d.stage==='Basic'){
      const label = !p.active ? 'Make Active' : 'Put on Bench';
      return actBtn('bench', label, whyNotBench(0,c), '', '', true);
    }
    let why = whyNotEvolve(0,c);
    if (!why && !evoTargets(0,c).length) why = `You need ${d.from} in play to evolve into ${d.name}.`;
    if (!why && !evoTargets(0,c).some(m=>!whyNotEvolve(0,c,m))) why = whyNotEvolve(0,c,evoTargets(0,c)[0]);
    return actBtn('evolve', `Evolve your ${d.from}`, why, '', '', true);
  }
  if (d.kind==='energy') return actBtn('attach', 'Attach to a Pokémon', whyNotAttach(0), '', '', true);
  return actBtn('play', `Play ${d.name}`, whyNotTrainer(0,c), '', '', true);

function monActions(m,owner){
  const p=P(owner);

  let h='';
  if (p.active===m){
    const oa=P(1).active;
    topC(m).attacks.forEach((atk,i)=>{
      const r=calcDamage(m,oa,atk), why=whyNotAttack(0,i);
      const label = `${atk.name}${r.notes.length?` <span class="why">${atk.dmg} → ${r.d} (${r.notes.join(', ')})</span>`:''}`;
      h += actBtn('attack', label, why, `data-i="${i}"`, r.d, true);
    });
    h += actBtn('retreat', `Retreat (discard ${topC(m).retreat} Energy)`, whyNotRetreat(0));
  } else if (topC(m).ability){
    h += actBtn('ability', `Use ${topC(m).ability.name}`, whyNotAbility(0,m), `data-uid="${m.uid}"`, '', true);
  }
  return h;
}
function modeView(){
  const u=S.ui, p=P(0);
  const card = u.data ? p.hand.find(c=>c.uid===u.data) : null;
  const msg = {
    attach:`Tap one of your Pokémon on the mat to attach ${card?D(card).name:'the Energy'}.`,
    evolve:`Tap the ${card?D(card).from:''} you want to evolve. Glowing Pokémon are legal targets.`,
    potion:'Tap a damaged Pokémon to heal 30.',
    switch:'Tap a Benched Pokémon to swap into the Active Spot.',
    retreat:`Tap a Benched Pokémon to become your new Active. ${topC(p.active).retreat} Energy will be discarded.`,
    promote:'Your Active Pokémon was Knocked Out. Tap a Benched Pokémon to move it into the Active Spot.',
    search:'Field Guide: choose a Basic Pokémon from your deck.'
  }[u.mode];
  let opts='';
  if (u.mode==='search'){
    const ids=[...new Set(p.deck.filter(isBasic).map(c=>c.id))];
    opts = `<div class="opts">${ids.map(id=>`<button class="btn ghost" data-act="do" data-a="search" data-id="${id}">${DEF[id].name} ×${p.deck.filter(c=>c.id===id).length}</button>`).join('')}</div>`;
  }
  return `<div class="insp-h"><b>${u.mode==='promote'?'New Active Pokémon':'Choose a target'}</b>${u.mode!=='promote'?'<button class="x" data-act="do" data-a="cancel" aria-label="Cancel">✕</button>':''}</div><div class="banner">${msg}</div>${opts}`;
}
function inspView(){
  const u=S.ui;
  if (u.mode) return modeView();
  if (!u.sel) return `<div class="insp-empty"><b class="lbl">Inspector</b><p>Tap any card on the mat or in your hand to read it and see what you can do with it.</p></div>`;
  const close = '<button class="x" data-act="close" aria-label="Close">✕</button>';
  if (u.sel.kind==='hand'){
    const c=P(0).hand.find(x=>x.uid===u.sel.uid);
    if (!c){ clearUI(); return inspView(); }
    return `<div class="insp-h"><b>${D(c).name}</b>${close}</div><div class="acts">${handActions(c)}</div>${fullCard(c.id)}`;
  }
  const m=findMon(P(u.sel.owner),u.sel.uid);
  if (!m){ clearUI(); return inspView(); }
  const d=topC(m), where = P(u.sel.owner).active===m ? 'Active' : 'Bench';
  const status = `<div class="status"><span>${u.sel.owner?'Rival':'Yours'} · ${where}</span><span>HP left <b>${hpLeft(m)}</b>/${d.hp}</span><span>Damage <b>${m.damage}</b></span><span>Energy ${m.energy.length?m.energy.map(e=>eIcon(D(e).type)).join(''):'<b>none</b>'}</span>${m.poisoned?'<span style="color:var(--poison);font-weight:700">Poisoned</span>':''}${m.stack.length>1?`<span>Evolved from ${D(m.stack[0]).name}</span>`:''}</div>`;
  const acts = monActions(m,u.sel.owner);
  return `<div class="insp-h"><b>${d.name}</b>${close}</div>${status}${acts?`<div class="acts">${acts}</div>`:''}${fullCard(d.id)}`;
}

function coach(){
  const p=P(0), o=P(1), h=[];
  if (S.over) return [];
  if (S.setup) return [!p.active ? 'Pick a Basic Pokémon from your hand to be your Active Pokémon. It takes the first hits, so a high-HP one is a safe choice.' : 'Bench any other Basic Pokémon you like, then press Start battle. Benched Pokémon are your backup when the Active is Knocked Out.'];
  if (S.ui.mode==='promote') return ['Pick your new Active Pokémon. One with Energy already attached can hit back right away.'];
  if (S.cur!==0) return ['The Rival is taking their turn. Watch the log to see what they do.'];
  if (S.turn===1) h.push(`You're going first, so you can't attack or play a Supporter this turn. Build your Bench and attach Energy.`);
  if (p.hand.some(c=>D(c).kind==='energy') && !p.energyAttached) h.push(`You haven't attached Energy yet. You get one per turn, so don't skip it.`);
  for (const c of p.hand.filter(c=>D(c).stage==='Stage 1')) if (inPlay(p).some(m=>!whyNotEvolve(0,c,m))){ h.push(`${D(c).name} can evolve your ${D(c).from} right now.`); break; }
  if (p.hand.some(isBasic) && p.bench.length<5) h.push('You have a Basic Pokémon in hand. Benching it gives you backup.');
  if (p.bench.some(m=>topC(m).ability && m.abilityTurn!==S.turn)) h.push('Puffkin on your Bench can use Tailwind Scout to draw a card.');
  const a=p.active, oa=o.active;
  if (a && oa){
    const opts=topC(a).attacks.map((atk,i)=>({atk,ok:!whyNotAttack(0,i),r:calcDamage(a,oa,atk)})).filter(x=>x.ok).sort((x,y)=>y.r.d-x.r.d);
    if (opts.length){ const b=opts[0]; h.push(`${b.atk.name} does ${b.r.d} to ${topC(oa).name}${b.r.notes.length?` (${b.r.notes.join(', ')})`:''}${b.r.d>=hpLeft(oa)?`. That's a Knock Out`:''}. Attacking ends your turn, so do everything else first.`); }
    else if (S.turn>1) h.push(`${topC(a).name} can't pay for an attack yet. Attach Energy, or retreat to a Pokémon that can.`);
    if (topC(a).weak===topC(oa).type) h.push(`Watch out: ${topC(a).name} is weak to ${TYPE[topC(oa).type].n}, so ${topC(oa).name} hits it for double.`);
  }
  return h.slice(0,4);
}
function logView(){ return `<div class="sect"><h3>Game log</h3><ol class="log">${S.log.map(l=>`<li class="${l.w===0?'w0':l.w===1?'w1':''}">${l.m}</li>`).join('')||'<li>Nothing has happened yet.</li>'}</ol></div>`; }
function lessonPanel(){
  const L=LESSONS[S.li];
  if (L.kind==='match'){
    const p=P(0), mine=!S.setup && S.cur===0;
    const ck=(on,t,s)=>`<li class="${on?'y':''}"><i></i><span>${t}${s?` <small>${s}</small>`:''}</span></li>`;
    return `<div class="eyebrow">Final exam</div><h2>Beat the Rival</h2>
      <div class="rival"><div class="pic"><img src="art/rival.webp" alt="The Rival, a young trainer in a green jacket" onerror="this.remove()"></div><div><b>The Rival</b><span>Grass deck with a splash of Water</span></div></div>
      <p>Your deck is Fire with a Colorless helper. The Rival plays Grass with some Water. First to take ${PRIZES} Prize cards wins.</p>
      <div class="sect"><h3>Coach</h3><ul class="coach">${coach().map(x=>`<li>${x}</li>`).join('')||'<li>Good game. Start a new match to play again.</li>'}</ul></div>
      <div class="sect"><h3>Your turn, in order</h3><ul class="check">
        ${ck(mine,'Draw a card','automatic')}${ck(mine&&p.energyAttached,'Attach 1 Energy','once')}${ck(mine&&p.supporterPlayed,'Play 1 Supporter','once')}
        ${ck(false,'Bench, evolve, play Items','any number')}${ck(mine&&p.retreated,'Retreat','optional, once')}${ck(false,'Attack','ends your turn')}</ul></div>
      <div class="goal-btns"><button class="btn ghost" data-act="newmatch">New match</button></div>
      ${logView()}`;
  }
  const last = S.li===LESSONS.length-2;
  return `<div class="eyebrow">Lesson ${S.li+1} of ${LESSONS.length-1}</div><h2>${L.title}</h2>${L.body}
    <div class="goal${S.done?' ok':''}"><div class="goal-h">${S.done?'Goal complete':'Your goal'}</div><p>${L.goal}</p>${L.hint&&!S.done?`<p class="hint">${L.hint}</p>`:''}
    <div class="goal-btns">${L.build?'<button class="btn ghost" data-act="reset">Reset lesson</button>':''}<button class="btn ${S.done?'primary':'ghost'}" data-act="next">${last?'Play a full match':'Next lesson'}</button></div></div>
    ${L.kind!=='anatomy'?logView():''}`;
}
const PARTS = [
  ['kind','Card kind','Trainer cards are Items or Supporters. Energy cards pay for attacks.'],
  ['stage','Stage','Basic Pokémon are played straight from your hand. Stage 1 cards must evolve from the Pokémon named here.'],
  ['name','Name','Evolution checks this exact name.'],
  ['hp','HP','Hit Points. When damage reaches this number, the Pokémon is Knocked Out.'],
  ['type','Type','Decides which Energy its attacks want and which Pokémon are weak to it.'],
  ['ability','Ability','A power you can use during your turn. It does not end your turn.'],
  ['cost','Attack cost','One symbol per Energy needed. The star is Colorless and any Energy pays for it.'],
  ['damage','Damage','Base damage, before Weakness and Resistance are applied.'],
  ['text','Effect text','What else the card or attack does.'],
  ['weakness','Weakness','Attacks from this type do double damage to it.'],
  ['resistance','Resistance','Attacks from this type do 30 less damage to it.'],
  ['retreat','Retreat cost','Energy you discard to move this Pokémon to the Bench.'],
  ['rule','Rule box','Special rules for the card. Pokémon ex give up 2 Prize cards.']
];
function anatomyView(){
  const ids=['cindlet','pyrrox','puffkin','magmaw','potion','research','fireE'];
  let card=fullCard(S.acard);
  const present=new Set([...card.matchAll(/data-part="(\w+)"/g)].map(x=>x[1]));
  if (S.part) card=card.replaceAll(`data-part="${S.part}"`, `data-part="${S.part}" data-hl`);
  return `<div class="anat panel">
    <div class="anat-chips">${ids.map(id=>`<button class="chip${S.acard===id?' on':''}" data-act="acard" data-id="${id}">${DEF[id].name}</button>`).join('')}</div>
    <div class="anat-grid"><div class="${S.part&&present.has(S.part)?'focus':''}">${card}</div>
    <ul class="parts">${PARTS.map(([k,t,x])=>`<li><button data-act="part" data-p="${k}" class="${S.part===k?'on':''}${present.has(k)?'':' absent'}"><b>${t}${present.has(k)?'':' · not on this card'}</b><span>${x}</span></button></li>`).join('')}</ul></div></div>`;
}
function overlay(){
  if (!S.over || S.overHidden) return '';
  const won=S.over.winner===0, lesson=S.mode==='lesson';
  return `<div class="ov"><div class="ov-box"><div class="eyebrow">${won?'Victory':'Defeat'}</div><h2>${won?'You win!':'The Rival wins'}</h2><p>${S.over.why}</p>
    <div class="goal-btns">${lesson?`<button class="btn primary" data-act="next">Play a full match</button><button class="btn ghost" data-act="reset">Replay lesson</button>`
    :`<button class="btn primary" data-act="newmatch">Play again</button><button class="btn ghost" data-act="hideov">View the board</button>`}</div></div></div>`;
}
function render(){
  checkLesson();
  const L=LESSONS[S.li];
  const hs=$('#hand')?.scrollLeft||0;
  $('#nav').innerHTML = LESSONS.map((l,i)=>`<button class="chip${i===S.li?' on':''}${DONE.has(l.key)?' done':''}" data-act="nav" data-i="${i}"><span class="n">${i<LESSONS.length-1?i+1:'▶'}</span>${l.title}</button>`).join('');
  $('#lesson').innerHTML = lessonPanel();
  const insp=$('#insp');
  if (L.kind==='anatomy'){ $('#stage').innerHTML=anatomyView(); insp.hidden=true; insp.classList.remove('open'); $('#app').classList.remove('sheet'); }
  else {
    $('#stage').innerHTML = boardView() + handView();
    insp.hidden=false; insp.innerHTML=inspView();
    const open=!!(S.ui.sel||S.ui.mode);
    insp.classList.toggle('open',open); $('#app').classList.toggle('sheet',open);
  }
  const h=$('#hand'); if (h) h.scrollLeft=hs;
  $('#ovl').innerHTML=overlay();
  if (S.hit){ const id=S.hit; setTimeout(()=>{ if (S.hit===id) S.hit=null; },500); }
}

/* ---------- input ---------- */
document.addEventListener('click', e => {
  const b=e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a=b.dataset.act, d=b.dataset;
  switch (a){
    case 'nav': return goLesson(+d.i);
    case 'next': return goLesson(S.li+1);
    case 'reset': return goLesson(S.li);
    case 'newmatch': return goLesson(LESSONS.length-1);
    case 'hideov': S.overHidden=true; return render();
    case 'part': S.part=d.p; S.partsSeen.add(d.p); return render();
    case 'acard': S.acard=d.id; return render();
    case 'close': clearUI(); return render();
  }
  if (S.over) return;
  if (S.busy){ toast('Wait for the Rival to finish their turn.'); return; }
  if (a==='hand'){
    if (S.ui.mode==='promote') return toast('First choose a new Active Pokémon from your Bench.');
    S.ui={sel:{kind:'hand',uid:+d.uid},mode:null,data:null}; return render();
  }
  if (a==='mon') return onMon(+d.owner,+d.uid);
  if (a==='do') return doUI(d.a,d);
});
function onMon(owner,uid){
  const mode=S.ui.mode;
  if (!mode){ S.ui.sel={kind:'mon',owner,uid}; return render(); }
  const p=P(0), m=findMon(P(owner),uid);
  if (owner!==0) return toast('Choose one of your own Pokémon.');
  const onBench=p.bench.includes(m);
  if (mode==='attach'){ doAttach(0,S.ui.data,uid); }
  else if (mode==='evolve'){ const c=p.hand.find(x=>x.uid===S.ui.data), r=whyNotEvolve(0,c,m); if (r) return toast(r); doEvolve(0,c.uid,uid); }
  else if (mode==='potion'){ if (!m.damage) return toast(`${topC(m).name} has no damage to heal.`); doTrainer(0,S.ui.data,uid); }
  else if (mode==='switch'){ if (!onBench) return toast('Choose a Benched Pokémon.'); doTrainer(0,S.ui.data,uid); }
  else if (mode==='retreat'){ if (!onBench) return toast('Choose a Benched Pokémon.'); doRetreat(0,uid); }
  else if (mode==='promote'){ if (!onBench) return toast('Choose a Benched Pokémon.'); doPromote(0,uid); clearUI(); const f=S.after; S.after=null; render(); if (f) f(); return; }
  else if (mode==='search') return toast('Pick a card from the list in the panel.');
  const keep = findMon(p,uid) ? uid : p.active.uid;
  S.ui={sel:{kind:'mon',owner:0,uid:mode==='retreat'||mode==='switch'?p.active.uid:keep},mode:null,data:null};
  render();
}
function doUI(a,d){
  const p=P(0);
  if (a==='cancel'){ if (S.ui.mode!=='promote'){ S.ui.mode=null; S.ui.data=null; } return render(); }
  if (a==='start'){
    if (!p.active) return toast('Choose an Active Pokémon first.');
    S.setup=false; const first=Math.random()<.5?0:1;
    log(`Coin flip: ${first===0?'you go first':'the Rival goes first'}.`);
    clearUI(); return startTurn(first);
  }
  if (S.locked) return toast(`This lesson's turn is over. Press Reset lesson to try again.`);
  if (!S.setup && S.cur!==0) return toast('Wait for your turn.');
  if (S.ui.mode==='promote') return toast('Choose a new Active Pokémon from your Bench first.');
  const sel=S.ui.sel, hc = sel?.kind==='hand' ? p.hand.find(c=>c.uid===sel.uid) : null;
  switch (a){
    case 'bench': { const r=whyNotBench(0,hc); if (r) return toast(r); const m=doBench(0,hc.uid); S.ui={sel:{kind:'mon',owner:0,uid:m.uid},mode:null,data:null}; break; }
    case 'attach': { const r=whyNotAttach(0); if (r) return toast(r); S.ui.mode='attach'; S.ui.data=hc.uid; break; }
    case 'evolve': S.ui.mode='evolve'; S.ui.data=hc.uid; break;
    case 'play': {
      const r=whyNotTrainer(0,hc); if (r) return toast(r);
      if (hc.id==='potion'||hc.id==='switch'){ S.ui.mode=hc.id; S.ui.data=hc.uid; }
      else if (hc.id==='fieldguide'){ S.ui.mode='search'; S.ui.data=hc.uid; }
      else { doTrainer(0,hc.uid); clearUI(); }
      break;
    }
    case 'search': doTrainer(0,S.ui.data,d.id); clearUI(); break;
    case 'retreat': { const r=whyNotRetreat(0); if (r) return toast(r); S.ui.mode='retreat'; break; }
    case 'attack': { const r=whyNotAttack(0,+d.i); if (r) return toast(r); return doAttack(0,+d.i); }
    case 'ability': { const m=findMon(p,+d.uid), r=whyNotAbility(0,m); if (r) return toast(r); doAbility(0,m.uid); break; }
    case 'end': log('You ended your turn.',0); return endTurn();
  }
  render();
}

$('#logo').innerHTML = `<svg viewBox="0 0 24 24"><path d="${TYPE.F.g}"/></svg>`;
goLesson(0);
</script>

<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
