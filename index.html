<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17123a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17123a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench Academy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>html,body{margin:0}:root{color-scheme:dark}[hidden]{display:none!important}img{max-width:100%}body{-webkit-tap-highlight-color:transparent}</style>
<title>Bench Academy</title>
<link rel="preload" href="fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts ship with the app (SIL Open Font License) so the installed game keeps its look offline. */
@font-face{font-family:'M PLUS Rounded 1c';src:url(fonts/m-plus-rounded-1c-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'M PLUS Rounded 1c';src:url(fonts/m-plus-rounded-1c-latin-700-normal.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'M PLUS Rounded 1c';src:url(fonts/m-plus-rounded-1c-latin-800-normal.woff2) format('woff2');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
/* One fixed 450 x 800 logical game screen (taller on tall phones), scaled to fit. Handheld-RPG look:
   indigo dither, cream double-bordered windows, pixel chrome, rounded reading type. */
:root{
  --night:#17123a; --win:#151b3d; --win-2:#1d2551; --frame:#f3e9d2; --frame-dim:#8f89b8;
  --ink:#f3e9d2; --muted:#aaa6cf; --accent:#ffd447; --accent-ink:#2b1a00; --accent-low:#b38a00;
  --coral:#ff6f61; --ok:#5fe08a; --warn:#ffd447; --danger:#ff6161; --poison:#b07cff;
  --field:#1d5e57; --card:#fbf3e2; --card-ink:#231d33; --card-line:#d9ccb0;
  --fire:#e8572f; --water:#2f7fd1; --grass:#3a9a4e; --lightning:#e0ad12; --colorless:#8d8778; --trainer:#3f7f88; --back:#2a2160;
  --f-pixel:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --f-round:'M PLUS Rounded 1c','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#0c0926;color:var(--ink);font-family:var(--f-round);font-size:15px;line-height:1.45;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.t-F{--t:var(--fire)} .t-W{--t:var(--water)} .t-G{--t:var(--grass)} .t-L{--t:var(--lightning)} .t-C{--t:var(--colorless)} .t-T{--t:var(--trainer)}
[class*="t-"]{--t-soft:color-mix(in srgb,var(--t) 22%,var(--card))}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}

/* ---------- the fixed frame ---------- */
#viewport{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:#0c0926;background-image:conic-gradient(from 90deg at 2px 2px,#0000 25%,#ffffff08 0);background-size:4px 4px}
#fit{position:relative;width:100%;height:100%}
#frame{position:absolute;left:50%;top:50%;width:450px;height:var(--fh,800px);transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;
  background:var(--night);background-image:conic-gradient(from 90deg at 2px 2px,#0000 25%,#ffffff07 0);background-size:4px 4px}
@media (min-aspect-ratio:10/16){#frame{border-radius:22px;box-shadow:0 0 0 3px #f3e9d255,0 24px 80px #000c}}
#screen{position:absolute;inset:0}

/* ---------- shared chrome ---------- */
.win{background:var(--win);border:3px solid var(--frame);border-radius:12px;box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px #f3e9d24d,0 5px 0 #00000055}
.btn{font-family:var(--f-pixel);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;border:3px solid var(--accent-ink);
  background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:0 4px 0 var(--accent-low);transition:transform .06s,box-shadow .06s;white-space:nowrap}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-low)}
.btn.ghost{background:var(--win-2);color:var(--ink);border-color:var(--frame);box-shadow:0 4px 0 #0008}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 #0008}
.btn.lg{padding:12px 16px;font-size:16px;width:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.eyebrow{font-family:var(--f-pixel);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-pixel);font-weight:700;font-size:22px;line-height:1.15;margin:2px 0 6px;text-wrap:balance}
.kbd{color:var(--accent);font-weight:800}
.muted{color:var(--muted);font-size:13.5px;margin:0}
.sec{font-family:var(--f-pixel);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.stack{display:grid;gap:10px}
.chip{flex:none;font-family:var(--f-pixel);font-size:13px;letter-spacing:.03em;border:2px solid var(--frame-dim);background:var(--win);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.arrow{width:40px;height:40px;flex:none;border:3px solid var(--frame);background:var(--win-2);border-radius:10px;cursor:pointer;font-size:15px;color:var(--accent);box-shadow:0 3px 0 #0008}
.arrow:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 #0008}
.arrow[disabled]{opacity:.35}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13.5px;cursor:pointer;padding:4px}

/* ---------- title + main menu ---------- */
.menu-screen{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;background:linear-gradient(#0e0b2a 0%,#2a1c5c 45%,#6b3a78 72%,#e0745a 100%);overflow:hidden}
.stars{position:absolute;inset:-50% 0 40% 0;background-image:radial-gradient(2px 2px at 20px 30px,#fff 98%,#0000),radial-gradient(2px 2px at 140px 90px,#ffe9a8 98%,#0000),
  radial-gradient(2px 2px at 260px 50px,#fff 98%,#0000),radial-gradient(1.5px 1.5px at 90px 150px,#cfc8ff 98%,#0000),radial-gradient(2px 2px at 330px 170px,#fff 98%,#0000);
  background-size:360px 220px;animation:drift 120s linear infinite;opacity:.85}
.moon{position:absolute;right:12%;top:10%;width:60px;height:60px;background:#fff3c4;box-shadow:0 0 40px #ffe9a866;
  clip-path:polygon(25% 0,75% 0,75% 8%,88% 8%,88% 20%,100% 20%,100% 80%,88% 80%,88% 92%,75% 92%,75% 100%,25% 100%,25% 92%,12% 92%,12% 80%,0 80%,0 20%,12% 20%,12% 8%,25% 8%)}
.hills{position:absolute;left:0;bottom:0;width:200%;display:flex;animation:scroll var(--spd) linear infinite}
.hills svg{width:50%;height:100%;display:block;shape-rendering:crispEdges}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes drift{to{transform:translateY(50%)}}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 18px;text-align:center}
.fan{position:relative;width:400px;height:190px;margin-bottom:-30px}
.fan-card{position:absolute;left:50%;bottom:0;width:112px;aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:var(--card);
  border:4px solid var(--frame);box-shadow:0 8px 0 #0006;transform-origin:50% 140%;transform:translateX(-50%) rotate(calc(var(--i)*13deg));animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.25s)}
.fan-card img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{translate:0 -8px}}
.logo{margin:0;font-family:var(--f-pixel);font-weight:700;line-height:.9;display:grid;gap:4px;
  --o:#26124f;text-shadow:4px 0 var(--o),-4px 0 var(--o),0 4px var(--o),0 -4px var(--o),4px 4px var(--o),-4px 4px var(--o),4px -4px var(--o),-4px -4px var(--o),0 12px 0 #0007}
.logo span{display:block;font-size:90px;color:var(--accent);animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.logo span+span{color:var(--frame);font-size:68px;animation-delay:.15s}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.mini-logo{text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),3px 3px var(--o),-3px 3px var(--o),3px -3px var(--o),-3px -3px var(--o),0 6px 0 #0006}
.mini-logo span{font-size:52px}.mini-logo span+span{font-size:40px}
.ribbon{font-family:var(--f-pixel);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#2b0f10;background:var(--coral);
  padding:6px 18px;box-shadow:0 4px 0 #8a2f2a;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.press{font-family:var(--f-pixel);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--frame);margin-top:24px;animation:blink 1.1s steps(1) infinite;background:none;border:0;cursor:pointer;text-shadow:0 3px 0 #0008}
@keyframes blink{50%{opacity:0}}
.legal{font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;color:#ffffffb0;margin:10px 0 0}
.sound{position:absolute;z-index:2;top:12px;right:12px;font-family:var(--f-pixel);font-size:12px;letter-spacing:.08em;background:#0008;border:2px solid var(--frame);color:var(--frame);border-radius:8px;padding:6px 10px;cursor:pointer}
.main-menu{width:100%;max-width:400px;padding:10px;display:grid;gap:2px;text-align:left}
.mi{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;padding:10px;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left}
.mi .cur,.lvl .cur{width:16px;color:var(--accent);visibility:hidden}
.mi.on,.lvl.on{background:#ffffff10}.mi.on .cur,.lvl.on .cur{visibility:visible;animation:nudge .6s steps(2) infinite}
.mi .tag{margin-left:auto;font-size:11px;letter-spacing:.1em;color:var(--muted)}
@keyframes nudge{50%{transform:translateX(4px)}}
.helpbox{width:100%;max-width:400px;display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;min-height:100px}
.helpbox .thumb{width:56px;aspect-ratio:63/88;border-radius:6px;overflow:hidden;flex:none;border:2px solid var(--frame)}
.helpbox .thumb img{width:100%;height:100%;object-fit:cover}
.helpbox p{margin:0;font-size:14px;line-height:1.45;min-height:3em}
.helpbox .meta{display:block;margin-top:4px;font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.prog{display:block;height:8px;margin-top:6px;background:#ffffff1c;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 10px,#0000 10px 12px)}

/* ---------- sub-screens: lessons, rival setup, gallery ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.screen-h{display:flex;align-items:center;gap:12px}
.screen-h h1{font-family:var(--f-pixel);font-weight:700;font-size:26px;letter-spacing:.03em;margin:0;color:var(--accent);line-height:1.05;
  text-shadow:3px 0 #26124f,-3px 0 #26124f,0 3px #26124f,0 -3px #26124f,0 5px 0 #0006}
.screen-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tb-btn{min-width:40px;height:38px;flex:none;border:3px solid var(--frame);background:var(--win-2);border-radius:10px;cursor:pointer;
  font-family:var(--f-pixel);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--accent);box-shadow:0 3px 0 #0008;padding:0 8px}
.tb-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
.level-list{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:8px}
.lvl{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--ink)}
.lvl-n{font-family:var(--f-pixel);font-weight:700;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--frame-dim);border-radius:6px;color:var(--muted)}
.lvl.done .lvl-n{border-color:var(--ok);color:var(--ok)}
.lvl-t{flex:1;font-weight:800;font-size:16px}
.lvl-s{font-size:18px;color:var(--frame-dim)}.lvl.done .lvl-s{color:var(--accent)}
.carousel{display:flex;align-items:center;gap:8px;padding:10px;border-color:var(--t)}
.car-card{flex:1;min-width:0}
.car-art{aspect-ratio:2/1;border-radius:8px;overflow:hidden;border:2px solid var(--frame-dim);background:var(--t-soft)}
.car-art img{width:100%;height:100%;object-fit:cover}
.car-body{display:grid;gap:4px;padding:8px 2px 0}
.car-body b{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-size:22px;letter-spacing:.04em}
.car-body>span{font-size:13.5px;color:var(--muted);min-height:2.9em}
.dots{display:flex;gap:6px;justify-content:center;padding-top:4px}
.dots i{width:8px;height:8px;background:var(--frame-dim);border-radius:2px}.dots i.on{background:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--frame);border-radius:12px;overflow:hidden;box-shadow:0 4px 0 #0007}
.seg button{border:0;background:var(--win);padding:11px 4px;font-family:var(--f-pixel);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:3px solid var(--frame)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg-help{margin:0;font-size:13.5px;color:var(--muted);min-height:3.9em}
.cycler{display:flex;align-items:center;justify-content:space-between;padding:6px}
.cycler b{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-size:19px;letter-spacing:.04em}
.go-btn{margin-top:auto}
.gal-filters{display:flex;flex-wrap:wrap;gap:6px}
.binder{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,auto);gap:12px 10px;align-content:center}
.bslot{padding:0;border:0;background:none;cursor:pointer;text-align:left;min-width:0}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--f-pixel);font-size:15px;letter-spacing:.06em}

/* ---------- game screen ---------- */
.game{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px 6px}
.topbar{display:flex;align-items:center;gap:8px;height:42px;flex:none}
.tb-title{flex:1;min-width:0;display:grid;line-height:1.15}
.tb-title b{font-family:var(--f-pixel);font-size:16px;letter-spacing:.05em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.tb-title small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbox{flex:none;height:60px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--win);border:3px solid var(--frame);border-radius:12px;
  box-shadow:inset 0 0 0 2px var(--win),inset 0 0 0 4px #f3e9d244}
.dbox p{flex:1;margin:0;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dbox p b{font-family:var(--f-pixel);color:var(--accent);letter-spacing:.04em}
.dbox.ok{border-color:var(--ok)}.dbox.ok p b{color:var(--ok)}
.dbox.mode{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--win))}
.dbox.mode p::before{content:"▶ ";color:var(--accent);font-family:var(--f-pixel)}
.dbox-btns{display:flex;gap:6px;flex:none}
.field{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px;padding:8px;border-radius:14px;border:3px solid var(--frame);
  background-color:var(--field);background-image:linear-gradient(#ffffff0d 1px,#0000 1px),linear-gradient(90deg,#ffffff0d 1px,#0000 1px);background-size:16px 16px;
  box-shadow:inset 0 0 0 3px var(--field),inset 0 0 0 5px #00000033,0 5px 0 #00000055}
.bench-row{display:grid;grid-template-columns:repeat(5,64px);gap:10px;justify-content:center}
.main-row{display:grid;grid-template-columns:1fr 98px 1fr;align-items:center;gap:8px}
.active-spot{width:98px}
.active-spot .mini,.active-spot .slot{box-shadow:0 0 0 3px var(--field),0 0 0 6px #ffd44766}
.slot{aspect-ratio:63/88;border:2px dashed #ffffff3a;border-radius:8px;display:grid;place-items:center}
.slot span{font-family:var(--f-pixel);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ffffff60}
.side-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.piles{display:flex;gap:6px}
.pile{position:relative;width:42px}
.pile .count{position:absolute;inset:auto 0 4px;text-align:center;font-family:var(--f-pixel);font-weight:700;font-size:14px;color:#fff;text-shadow:0 2px 0 #000}
.prize-grid{display:grid;grid-template-columns:repeat(2,28px);gap:4px}
.pz{aspect-ratio:63/88;border-radius:4px;border:2px solid var(--frame);background:radial-gradient(circle,var(--accent) 0 14%,#0000 15%),linear-gradient(var(--back),#3b2f86)}
.pz.gone{background:none;border:2px dashed #ffffff40}
.cap{font-family:var(--f-pixel);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#d8f5ec;text-align:center;line-height:1.2}
.cback{aspect-ratio:63/88;width:100%;border-radius:6px;border:2px solid var(--frame);
  background:radial-gradient(circle at 50% 50%,var(--accent) 0 10%,var(--coral) 10% 16%,#0000 16%),repeating-linear-gradient(45deg,#0000 0 5px,#ffffff0f 5px 10px),linear-gradient(var(--back),#3b2f86);box-shadow:0 2px 0 #0006}
.cback.ghost{background:none;border:2px dashed #ffffff40;box-shadow:none}
.turnbar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 6px 0 12px;background:var(--win);border:3px solid var(--frame);border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--win),inset 0 0 0 4px #f3e9d244}
.turnchip{font-family:var(--f-pixel);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.turnchip small{font-size:11px;color:var(--muted)}
.turnchip.me{color:var(--accent)}.turnchip.opp{color:var(--coral)}
.mid-note{font-size:12.5px;color:var(--muted);padding-right:6px}
.mid-note::after{content:" ▼";color:var(--accent);animation:blink 1s steps(1) infinite}
.conn{display:inline-block;font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 8px}

/* in-play card */
.mini{container-type:inline-size;position:relative;display:flex;flex-direction:column;aspect-ratio:63/88;width:100%;padding:0;cursor:pointer;
  border:3px solid color-mix(in srgb,var(--t) 70%,#000);border-radius:8px;background:var(--card);color:var(--card-ink);overflow:hidden;text-align:left;box-shadow:0 3px 0 #0006}
.m-top{display:flex;align-items:center;gap:3cqw;padding:4cqw 5cqw 3cqw;background:var(--t);color:#fff;font-weight:800;font-size:13cqw;line-height:1.05}
.m-top.long{font-size:10.5cqw}
.m-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #0005}
.ex{font-family:var(--f-pixel);background:#fff;color:var(--card-ink);border-radius:3px;padding:0 3px;font-size:.8em;line-height:1.25}
.m-art{display:block;height:36%}
.m-art svg,.hc-art svg,.fc-art svg,.opt-art svg{display:block;width:100%;height:100%}
.m-hp{display:flex;align-items:baseline;gap:2cqw;padding:3cqw 5cqw 0;font-family:var(--f-pixel);font-size:10cqw}
.m-hp b{font-size:18cqw;line-height:1}
.m-bar{margin:2cqw 5cqw 0;height:6cqw;background:#2b2440;padding:1cqw;border-radius:1cqw}
.m-bar i{display:block;height:100%;background:var(--ok)}.m-bar i.mid{background:var(--warn)}.m-bar i.lo{background:var(--danger)}
.m-en{display:flex;flex-wrap:wrap;gap:2cqw;padding:3cqw 5cqw;margin-top:auto}
.m-en .ei{width:15cqw;height:15cqw}
.dmgc{position:absolute;right:4cqw;top:26%;width:30cqw;height:30cqw;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;
  font-family:var(--f-pixel);font-weight:700;font-size:13cqw;border:2cqw solid #fff;box-shadow:0 1px 3px #0006}
.psn{position:absolute;left:4cqw;top:26%;background:var(--poison);color:#fff;font-family:var(--f-pixel);font-size:9cqw;border-radius:3px;padding:1cqw 3cqw;text-transform:uppercase}
.psn.para{background:var(--lightning);color:#231a00}
.mini.sel{outline:3px solid var(--accent);outline-offset:2px}
.mini.tgt{outline:3px dashed var(--accent);outline-offset:3px;animation:pulse .9s steps(2) infinite}
.mini.hit{animation:hit .45s}
@keyframes pulse{50%{outline-offset:6px}}
@keyframes hit{20%{transform:translateX(-6%)}40%{transform:translateX(6%);filter:brightness(2)}60%{transform:translateX(-4%)}80%{transform:translateX(2%)}}

/* fanned hand */
.handzone{position:relative;flex:none;height:118px}
.hand-count{position:absolute;left:4px;top:-2px;font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hand{position:absolute;left:50%;bottom:2px;height:108px;transform:translateX(-50%)}
.handzone .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.hc{container-type:inline-size;position:absolute;bottom:0;width:76px;aspect-ratio:63/88;display:flex;flex-direction:column;padding:0;cursor:pointer;text-align:left;
  border:3px solid color-mix(in srgb,var(--t) 70%,#000);border-radius:8px;background:var(--card);color:var(--card-ink);overflow:hidden;box-shadow:0 4px 0 #0007;
  transform-origin:50% 120%;transform:translateY(var(--y)) rotate(var(--r));transition:transform .12s}
.hc.sel{transform:translateY(-16px) rotate(0);outline:3px solid var(--accent);outline-offset:1px}
.hc-kind{font-family:var(--f-round);font-weight:800;font-size:9cqw;letter-spacing:.06em;text-transform:uppercase;padding:4cqw 5cqw 0;color:color-mix(in srgb,var(--t) 75%,var(--card-ink))}
.hc-name{font-weight:800;font-size:12.5cqw;line-height:1.05;padding:1cqw 5cqw 3cqw;min-height:2.2em}
.hc-art{display:block;flex:1;min-height:0;background:var(--t-soft)}
.hc-foot{font-family:var(--f-pixel);font-size:10cqw;padding:3cqw 5cqw;display:flex;justify-content:space-between;align-items:center}
.hc-foot .ei{width:14cqw;height:14cqw}

.ei{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--t);flex:none;vertical-align:middle;box-shadow:inset 0 -2px 0 #0003,0 0 0 1.5px #fff8}
.ei svg{width:66%;height:66%;fill:#fff}

/* ---------- full card: one fixed 63:88 face that scales as a unit ---------- */
.fc{container-type:inline-size;width:100%;max-width:340px;margin:0 auto}
.fc-face{aspect-ratio:63/88;width:100%;display:flex;flex-direction:column;gap:2cqw;padding:3.6cqw;border-radius:5cqw;border:2.6cqw solid color-mix(in srgb,var(--t) 78%,#1a1530);
  color:var(--card-ink);overflow:hidden;background:linear-gradient(var(--t-soft),var(--card) 38%);box-shadow:0 5px 0 #0008;font-size:4cqw;line-height:1.3;text-align:left}
.fc .ei{width:5.6cqw;height:5.6cqw;box-shadow:inset 0 -1px 0 #0003}
.fc-head{display:grid;gap:.5cqw}
.fc-stage{display:flex;align-items:center;gap:2cqw;min-height:5cqw}
.stage{font-family:var(--f-round);font-weight:800;font-size:3.2cqw;letter-spacing:.08em;text-transform:uppercase;background:var(--card-ink);color:var(--card);border-radius:1cqw;padding:.3cqw 1.6cqw}
.from{font-size:3.3cqw;color:color-mix(in srgb,var(--card-ink) 65%,transparent)}
.fc-title{display:flex;align-items:center;gap:2cqw}
.fc-name{flex:1;min-width:0;font-weight:800;font-size:7cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-hp{font-family:var(--f-pixel);font-weight:700;font-size:7.4cqw;white-space:nowrap}
.fc-hp small{font-size:3.6cqw;margin-right:.6cqw}
.fc-art{flex:none;aspect-ratio:16/9;border-radius:2cqw;overflow:hidden;border:1cqw solid color-mix(in srgb,var(--t) 45%,var(--card));background:var(--t-soft)}
.fc.dense .fc-art{aspect-ratio:2/1}.fc.dense2 .fc-art{aspect-ratio:12/5}
.fc-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw}
.fc-ability{background:color-mix(in srgb,#b23a48 12%,var(--card));border-radius:2cqw;padding:1.6cqw 2.4cqw;font-size:3.5cqw}
.ab-tag{font-family:var(--f-round);font-weight:800;font-size:3cqw;letter-spacing:.06em;text-transform:uppercase;background:#b23a48;color:#fff;border-radius:1cqw;padding:0 1.4cqw}
.fc-ability p{margin:.6cqw 0 0}
.fc-atk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2cqw;align-items:center;padding-top:1.6cqw;border-top:.5cqw solid var(--card-line)}
.fc-atk:first-child{border-top:0;padding-top:0}
.cost{display:flex;gap:.5cqw;min-width:12cqw}
.atk-main b{font-size:4.8cqw;font-weight:800}
.atk-text{display:block;font-size:3.35cqw;line-height:1.28}
.dmg{font-family:var(--f-pixel);font-weight:700;font-size:7cqw;min-width:2ch;text-align:right}
.fc.dense .atk-text,.fc.dense .fc-ability{font-size:3.1cqw}
.fc.dense2 .atk-text{font-size:2.95cqw}.fc.dense2 .atk-main b{font-size:4.4cqw}
.fc-rule{font-size:3.2cqw;border:.5cqw solid var(--card-line);border-radius:1.6cqw;padding:1.2cqw 2cqw;background:#ffffff80}
.fc.dense2 .fc-rule{font-size:2.9cqw}
.fc-text{margin:0;font-size:4.2cqw;font-weight:700}
.kindpill{font-family:var(--f-round);font-weight:800;font-size:3.2cqw;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--t);border-radius:1cqw;padding:.4cqw 1.8cqw}
.fc-foot{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2cqw;font-size:3.4cqw;border-top:.5cqw solid var(--card-line);padding-top:1.4cqw}
.fc-foot > span{display:flex;flex-direction:column;align-items:flex-start;gap:.4cqw}
.fc-foot small{font-family:var(--f-round);font-weight:800;font-size:2.6cqw;text-transform:uppercase;letter-spacing:.07em;color:color-mix(in srgb,var(--card-ink) 60%,transparent)}
.fc-foot .val{display:flex;gap:.5cqw;align-items:center;font-weight:800}
.fc-trainer-foot{flex:none;font-family:var(--f-round);font-weight:800;font-size:2.8cqw;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--card-ink) 55%,transparent);text-align:center}
.part{border-radius:1.5cqw;transition:opacity .2s,box-shadow .2s}
.focus .part:not([data-hl]){opacity:.35}
[data-hl]{box-shadow:0 0 0 1cqw var(--accent);opacity:1}
.art-wrap{position:relative;display:block;width:100%;height:100%}
.art-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ---------- anatomy lesson ---------- */
.anat{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.anat-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.anat-chips .chip{font-size:12px;padding:3px 7px}
.anat-card{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.anat-card .fc{width:auto;height:100%;max-height:420px;aspect-ratio:63/88}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.parts button{border:2px solid var(--frame-dim);background:var(--win-2);border-radius:8px;padding:5px 4px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink)}
.parts button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--win-2));color:var(--accent)}
.parts button.absent{opacity:.45}
.part-help{flex:none;min-height:64px;padding:8px 12px;font-size:13.5px;line-height:1.35}
.part-help b{font-family:var(--f-pixel);color:var(--accent);letter-spacing:.04em}
.part-help i{color:var(--muted)}

/* ---------- lobby ---------- */
.lobby{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:4px 6px;text-align:center}
.lobby p{margin:0}
.lobby .hint{font-size:13px;color:var(--muted)}
.lobby-art{display:flex;justify-content:center;gap:10px;height:140px}
.lobby-art img{height:100%;aspect-ratio:63/88;object-fit:cover;border-radius:8px;border:3px solid var(--frame);box-shadow:0 5px 0 #0007}
.lobby-art img:first-child{transform:rotate(-6deg)}.lobby-art img:last-child{transform:rotate(6deg)}
.qr{background:#fff;border-radius:12px;padding:8px;width:280px;margin:0 auto;border:4px solid var(--frame)}
.qr svg{display:block;width:100%;height:auto}
.err{color:var(--danger);font-size:14px;margin:0}
textarea{width:100%;height:84px;resize:none;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;border:2px solid var(--frame-dim);border-radius:8px;padding:8px;background:var(--win-2);color:var(--ink);word-break:break-all;margin:6px 0;-webkit-user-select:text;user-select:text}
#scan{position:fixed;inset:0;z-index:70;background:#000;display:grid;place-items:center;align-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#scan .scan-box{position:relative;width:min(88vw,420px);aspect-ratio:1;border-radius:18px;overflow:hidden;background:#111}
#scan video{width:100%;height:100%;object-fit:cover;display:block}
#scan .scan-frame{position:absolute;inset:10%;border:3px dashed var(--accent);border-radius:14px;box-shadow:0 0 0 2000px #0007}
#scan p{color:#fff;margin:0;text-align:center}

/* ---------- modals (inside the frame) ---------- */
#modal{position:absolute;inset:0;pointer-events:none;z-index:40}
#modal>*{pointer-events:auto}
.modal-back{position:absolute;inset:0;background:#0b0820b8}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;max-height:calc(100% - 24px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .18s steps(4)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-h b{font-family:var(--f-pixel);font-size:18px;letter-spacing:.04em;color:var(--accent)}
.x{border:2px solid var(--frame);background:var(--win-2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);flex:none}
.zoom-card .fc{max-width:250px}
.sheet.zoom{top:12px;justify-content:center}
.sheet.zoom .zoom-card .fc{max-width:330px}
.acts{display:grid;gap:8px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:2px solid var(--frame-dim);background:var(--win-2);border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 #0007;color:var(--ink)}
.act.go{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--win-2))}
.act.go b::before{content:"▶ ";color:var(--accent);font-family:var(--f-pixel)}
.act[disabled]{cursor:not-allowed;opacity:.8;box-shadow:none}
.act .why{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.act b{font-weight:800}
.act .num{font-family:var(--f-pixel);font-weight:700;font-size:20px;white-space:nowrap;color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);align-items:center}
.status b{color:var(--ink)}.st-p{color:var(--poison);font-weight:800}.st-z{color:var(--lightning);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:grid;gap:4px;border:2px solid var(--frame-dim);background:var(--win-2);border-radius:10px;padding:6px;cursor:pointer;color:var(--ink);text-align:center}
.opt-art{aspect-ratio:5/3;border-radius:6px;overflow:hidden;background:var(--t-soft)}
.opt b{font-size:12.5px;line-height:1.2}.opt small{font-family:var(--f-pixel);color:var(--accent)}
.intro{font-size:14.5px}
.intro p{margin:0 0 8px}
.goal-line{border:2px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-top:4px}
.goal-line b{font-family:var(--f-pixel);color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.coach{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.coach li{background:var(--win-2);border-left:4px solid var(--accent);border-radius:4px 8px 8px 4px;padding:7px 10px;font-size:14px}
.check{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px}
.check li{display:flex;gap:8px;align-items:center}
.check i{width:16px;height:16px;border:2px solid var(--frame-dim);flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.check li.y i{background:var(--ok);border-color:var(--ok);color:#06210f}.check li.y i::after{content:"✓"}
.check small{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:3px;max-height:520px;overflow:auto}
.log li{padding:3px 0 3px 9px;border-left:3px solid var(--frame-dim);color:var(--muted)}
.log li.w0{border-color:var(--accent);color:var(--ink)}.log li.w1{border-color:var(--coral);color:var(--ink)}
.result{top:50%;bottom:auto;transform:translateY(-50%);text-align:center;animation:none}
.result .big{font-size:44px;color:var(--accent);margin:4px 0;text-shadow:3px 0 #26124f,-3px 0 #26124f,0 3px #26124f,0 -3px #26124f,0 6px 0 #0006}
.result p{margin:0}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-160%);z-index:60;background:var(--win);color:var(--ink);border:3px solid var(--frame);padding:9px 14px;border-radius:10px;
  font-size:14px;width:max-content;max-width:420px;box-shadow:0 6px 0 #0008;transition:transform .2s steps(4)}
#toast.show{transform:translate(-50%,0)}
</style>


</head>
<body>
<div id="viewport"><div id="fit"><div id="frame">
  <main id="screen"></main>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div></div></div>
<div id="scan" hidden><div class="scan-box"><video playsinline muted></video><div class="scan-frame"></div></div><p>Point the camera at the code on the other phone.</p><button class="btn ghost" id="scan-cancel">Cancel</button></div>

<script src="vendor/qrcode.min.js"></script>
<script src="vendor/jsQR.min.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>

<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
