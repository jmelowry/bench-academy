<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17123a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17123a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench Academy">
<link rel="manifest" href="manifest.webmanifest">

<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}[hidden]{display:none!important}img{max-width:100%}body{-webkit-tap-highlight-color:transparent}</style>
<title>Bench Academy</title>
<link rel="preload" href="fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts ship with the app (SIL Open Font License) so the installed game keeps its look offline. */
@font-face{font-family:'M PLUS Rounded 1c';src:url(fonts/m-plus-rounded-1c-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'M PLUS Rounded 1c';src:url(fonts/m-plus-rounded-1c-latin-700-normal.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'M PLUS Rounded 1c';src:url(fonts/m-plus-rounded-1c-latin-800-normal.woff2) format('woff2');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Pixelify Sans';src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}

/* Look: a handheld-RPG at dusk. Indigo dither ground, cream double-bordered windows, pixel type for chrome,
   rounded type for reading, warm card faces. One committed dark look. */
:root{
  --night:#17123a; --night-2:#231a52; --dusk:#4b2d6e; --ember:#ff8a5b;
  --win:#151b3d; --win-2:#1d2551; --frame:#f3e9d2; --frame-dim:#8f89b8;
  --ink:#f3e9d2; --muted:#aaa6cf; --accent:#ffd447; --accent-ink:#2b1a00; --accent-low:#b38a00;
  --coral:#ff6f61; --ok:#5fe08a; --warn:#ffd447; --danger:#ff6161; --poison:#b07cff;
  --field:#1d5e57; --field-2:#22706a; --field-line:#7fd6c2;
  --card:#fbf3e2; --card-ink:#231d33; --card-line:#d9ccb0;
  --fire:#e8572f; --water:#2f7fd1; --grass:#3a9a4e; --lightning:#e0ad12; --colorless:#8d8778; --trainer:#3f7f88; --back:#2a2160;
  --f-pixel:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --f-round:'M PLUS Rounded 1c','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-round);font-size:15px;line-height:1.5;
  background-image:conic-gradient(from 90deg at 2px 2px,#0000 25%,#ffffff07 0) ;background-size:4px 4px}
button{font:inherit;color:inherit}
img{max-width:100%}
.t-F{--t:var(--fire)} .t-W{--t:var(--water)} .t-G{--t:var(--grass)} .t-L{--t:var(--lightning)} .t-C{--t:var(--colorless)} .t-T{--t:var(--trainer)}
[class*="t-"]{--t-soft:color-mix(in srgb,var(--t) 22%,var(--card))}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- shared game chrome ---------- */
.pix{font-family:var(--f-pixel);letter-spacing:.04em}
.win{background:var(--win);border:3px solid var(--frame);border-radius:12px;
  box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px color-mix(in srgb,var(--frame) 30%,transparent),0 6px 0 #00000055}
.btn{font-family:var(--f-pixel);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;border:3px solid var(--accent-ink);
  background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--accent-low);
  transition:transform .06s,box-shadow .06s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-low)}
.btn.ghost{background:var(--win-2);color:var(--ink);border-color:var(--frame);box-shadow:0 4px 0 #0008}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 #0008}
.btn.lg{padding:13px 18px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.eyebrow{font-family:var(--f-pixel);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-pixel);font-weight:700;font-size:24px;line-height:1.15;margin:4px 0 10px;text-wrap:balance}
.kbd{color:var(--accent);font-weight:800}

/* ---------- title + main menu ---------- */
#menu.titled{position:relative;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{position:absolute;inset:0;background:linear-gradient(#0e0b2a 0%,#2a1c5c 45%,#6b3a78 72%,#e0745a 100%);overflow:hidden;z-index:0}
.stars{position:absolute;inset:-50% 0 40% 0;background-image:radial-gradient(2px 2px at 20px 30px,#fff 98%,#0000),radial-gradient(2px 2px at 140px 90px,#ffe9a8 98%,#0000),
  radial-gradient(2px 2px at 260px 50px,#fff 98%,#0000),radial-gradient(1.5px 1.5px at 90px 150px,#cfc8ff 98%,#0000),radial-gradient(2px 2px at 330px 170px,#fff 98%,#0000);
  background-size:360px 220px;animation:drift 120s linear infinite;opacity:.85}
.moon{position:absolute;right:12%;top:12%;width:64px;height:64px;background:#fff3c4;box-shadow:0 0 0 6px #fff3c433,0 0 40px #ffe9a866;
  clip-path:polygon(25% 0,75% 0,75% 8%,88% 8%,88% 20%,100% 20%,100% 80%,88% 80%,88% 92%,75% 92%,75% 100%,25% 100%,25% 92%,12% 92%,12% 80%,0 80%,0 20%,12% 20%,12% 8%,25% 8%)}
.hills{position:absolute;left:0;bottom:0;width:200%;display:flex;animation:scroll var(--spd) linear infinite}
.hills svg{width:50%;height:100%;display:block;shape-rendering:crispEdges}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes drift{to{transform:translateY(50%)}}
.title-wrap{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:14px;min-height:inherit;padding-block:36px 28px;text-align:center}
.fan{position:relative;width:min(520px,92vw);height:clamp(150px,30vw,210px);margin-bottom:-36px}
.fan-card{position:absolute;left:50%;bottom:0;width:clamp(88px,18vw,124px);aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:var(--card);
  border:4px solid var(--frame);box-shadow:0 8px 0 #0006;transform-origin:50% 140%;
  transform:translateX(-50%) rotate(calc(var(--i)*13deg));animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.25s)}
.fan-card img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{translate:0 -8px}}
.logo{margin:0;font-family:var(--f-pixel);font-weight:700;line-height:.9;letter-spacing:.02em;display:grid;gap:4px;
  --o:#26124f;text-shadow:4px 0 var(--o),-4px 0 var(--o),0 4px var(--o),0 -4px var(--o),4px 4px var(--o),-4px 4px var(--o),4px -4px var(--o),-4px -4px var(--o),0 12px 0 #0007}
.logo span{display:block;font-size:clamp(46px,12vw,104px);color:var(--accent);animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.logo span+span{color:var(--frame);font-size:clamp(36px,9.2vw,80px);animation-delay:.15s}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.ribbon{font-family:var(--f-pixel);font-weight:700;font-size:clamp(12px,2.6vw,15px);letter-spacing:.2em;text-transform:uppercase;color:#2b0f10;background:var(--coral);
  padding:6px 18px;box-shadow:0 4px 0 #8a2f2a;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.press{font-family:var(--f-pixel);font-weight:700;font-size:clamp(18px,4vw,24px);letter-spacing:.18em;color:var(--frame);margin:22px 0 0;animation:blink 1.1s steps(1) infinite;
  background:none;border:0;cursor:pointer;text-shadow:0 3px 0 #0008}
@keyframes blink{50%{opacity:0}}
.legal{font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;color:#ffffffb0;margin:16px 0 0}
.sound{position:absolute;z-index:2;top:12px;right:max(12px,env(safe-area-inset-right,0px));font-family:var(--f-pixel);font-size:12px;letter-spacing:.08em;
  background:#0008;border:2px solid var(--frame);color:var(--frame);border-radius:8px;padding:6px 10px;cursor:pointer}
.mini-logo{font-size:0;--o:#26124f;text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),3px 3px var(--o),-3px 3px var(--o),3px -3px var(--o),-3px -3px var(--o),0 6px 0 #0006}.mini-logo span{font-size:clamp(34px,8vw,58px)}.mini-logo span+span{font-size:clamp(26px,6vw,44px)}
.main-menu{width:min(440px,100%);padding:10px;display:grid;gap:2px;text-align:left;margin-top:8px}
.mi{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-weight:700;font-size:clamp(17px,4.4vw,21px);letter-spacing:.08em;
  text-transform:uppercase;background:none;border:0;padding:10px 10px;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left}
.mi .cur{width:18px;color:var(--accent);visibility:hidden}
.mi.on{background:#ffffff10}.mi.on .cur{visibility:visible;animation:nudge .6s steps(2) infinite}
.mi .tag{margin-left:auto;font-size:11px;letter-spacing:.1em;color:var(--muted)}
@keyframes nudge{50%{transform:translateX(4px)}}
.helpbox{width:min(440px,100%);display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;min-height:96px}
.helpbox .thumb{width:56px;aspect-ratio:63/88;border-radius:6px;overflow:hidden;flex:none;border:2px solid var(--frame)}
.helpbox .thumb img{width:100%;height:100%;object-fit:cover}
.helpbox p{margin:0;font-size:14px;line-height:1.45}
.helpbox .meta{display:block;margin-top:4px;font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.prog{display:block;height:8px;margin-top:6px;background:#ffffff1c;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 10px,#0000 10px 12px)}

/* ---------- in-game HUD ---------- */
.app.full{padding:0;max-width:none}
.app{max-width:1380px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.brand{font-family:var(--f-pixel);font-weight:700;font-size:20px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;color:var(--accent);
  text-shadow:2px 0 #26124f,-2px 0 #26124f,0 2px #26124f,0 -2px #26124f}
.brand .ei{width:24px;height:24px}
.brand small{display:none}
nav{flex:1;min-width:0;overflow-x:auto;display:flex;gap:6px;padding-bottom:4px;scrollbar-width:thin}
header nav:empty{display:none}
.chip{flex:none;font-family:var(--f-pixel);font-size:13px;letter-spacing:.04em;border:2px solid var(--frame-dim);background:var(--win);color:var(--ink);
  border-radius:8px;padding:5px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip .n{color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}.chip.on .n{color:inherit}
.chip.done .n::after{content:" ★";color:var(--ok)}.chip.on.done .n::after{color:inherit}
.hud-btns{display:flex;gap:8px;margin-left:auto}
.hud-btns .btn{padding:6px 12px;font-size:12px}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"lesson" "stage" "insp"}
@media (min-width:760px){.layout{grid-template-columns:290px minmax(0,1fr);grid-template-areas:"lesson stage" "insp stage";align-items:start}}
@media (min-width:1200px){.layout{grid-template-columns:300px minmax(0,1fr) 320px;grid-template-areas:"lesson stage insp"}}
#lesson{grid-area:lesson;min-width:0}#stage{grid-area:stage;min-width:0}#insp{grid-area:insp;min-width:0}
.panel,#insp{background:var(--win);border:3px solid var(--frame);border-radius:12px;padding:16px;
  box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px color-mix(in srgb,var(--frame) 30%,transparent),0 6px 0 #00000055}
.panel p{margin:0 0 10px}.panel p:last-child{margin-bottom:0}
.goal{margin-top:14px;border:2px dashed var(--accent);border-radius:10px;padding:12px;background:#ffd4470d}
.goal.ok{border-style:solid;border-color:var(--ok);background:#5fe08a14}
.goal-h{font-family:var(--f-pixel);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin-bottom:4px;color:var(--accent)}
.goal.ok .goal-h{color:var(--ok)}
.hint{font-size:13.5px;color:var(--muted)}
.goal-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.sect{margin-top:16px}
.sect h3{font-family:var(--f-pixel);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.coach{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.coach li{background:var(--win-2);border-left:4px solid var(--accent);border-radius:4px 8px 8px 4px;padding:8px 10px;font-size:14px}
.coach li::before{content:"▶ ";color:var(--accent);font-family:var(--f-pixel)}
.check{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.check li{display:flex;gap:8px;align-items:center}
.check i{width:16px;height:16px;border:2px solid var(--frame-dim);flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.check li.y i{background:var(--ok);border-color:var(--ok);color:#06210f}.check li.y i::after{content:"✓"}
.check small{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;max-height:230px;overflow:auto;font-size:13px;display:grid;gap:3px}
.log li{padding:3px 0 3px 9px;border-left:3px solid var(--frame-dim);color:var(--muted)}
.log li.w0{border-color:var(--accent);color:var(--ink)}.log li.w1{border-color:var(--coral);color:var(--ink)}
.rival{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.rival .pic{width:64px;height:64px;flex:none;overflow:hidden;border:3px solid var(--frame);border-radius:8px;background:var(--win-2)}
.rival .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.rival b{display:block;font-family:var(--f-pixel);font-size:16px;letter-spacing:.04em}
.rival span{font-size:13px;color:var(--muted)}

/* ---------- battlefield ---------- */
.mat{position:relative;max-width:640px;margin:0 auto;padding:12px;border-radius:14px;border:3px solid var(--frame);
  background-color:var(--field);
  background-image:linear-gradient(#ffffff0d 1px,#0000 1px),linear-gradient(90deg,#ffffff0d 1px,#0000 1px),radial-gradient(circle at 50% 50%,#ffffff14 0 56px,#0000 57px);
  background-size:16px 16px,16px 16px,100% 100%;box-shadow:inset 0 0 0 3px var(--field),inset 0 0 0 5px #00000033,0 6px 0 #00000055}
.side{display:grid;gap:8px}
.lbl{font-family:var(--f-pixel);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#d8f5ec;line-height:1.2}
.row5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;align-items:end}
.bench{padding:6px;border:2px dashed #ffffff40;border-radius:10px}
.slot{aspect-ratio:63/88;border:2px dashed #ffffff33;border-radius:8px}
.zone{display:grid;gap:4px;min-width:0}
.active-zone .mini,.active-zone .slot{box-shadow:0 0 0 3px var(--field),0 0 0 6px #ffd44766}
.prizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px;border:2px dashed #ffffff40;border-radius:10px}
.cback{aspect-ratio:63/88;width:100%;border-radius:7px;border:3px solid var(--frame);
  background:radial-gradient(circle at 50% 50%,var(--accent) 0 9%,var(--coral) 9% 15%,#0000 15%),
    repeating-linear-gradient(45deg,#0000 0 6px,#ffffff0f 6px 12px),linear-gradient(var(--back),#3b2f86);box-shadow:0 3px 0 #0006}
.cback.ghost{background:none;border:2px dashed #ffffff40;box-shadow:none}
.pile{position:relative}
.pile .count{position:absolute;inset:auto 0 6px;text-align:center;font-family:var(--f-pixel);font-weight:700;font-size:18px;color:#fff;text-shadow:0 2px 0 #000}
.pile .cback.ghost + .count{color:#d8f5ec;text-shadow:none}
.opp-hand{display:flex;align-items:center;gap:8px}
.opp-hand .av{width:26px;height:26px;overflow:hidden;border:2px solid var(--frame);border-radius:6px;flex:none}
.opp-hand .av img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.midline{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;padding:10px 14px;
  background:var(--win);border:3px solid var(--frame);border-radius:10px;box-shadow:inset 0 0 0 2px var(--win),inset 0 0 0 4px #f3e9d244}
.turnchip{font-family:var(--f-pixel);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.turnchip.me{color:var(--accent)}.turnchip.opp{color:var(--coral)}
.mid-note{font-size:13px;color:var(--muted)}
.mid-note::after{content:" ▼";color:var(--accent);animation:blink 1s steps(1) infinite}
.conn{display:inline-block;font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 8px;vertical-align:middle}
.conn.ok{background:#5fe08a22;color:var(--ok)}.conn.bad{background:#ff616122;color:var(--danger)}

/* in-play card */
.mini{container-type:inline-size;position:relative;display:flex;flex-direction:column;aspect-ratio:63/88;width:100%;padding:0;cursor:pointer;
  border:3px solid color-mix(in srgb,var(--t) 70%,#000);border-radius:8px;background:var(--card);color:var(--card-ink);overflow:hidden;text-align:left;box-shadow:0 3px 0 #0006}
.m-top{display:flex;align-items:center;gap:3cqw;padding:4cqw 5cqw 3cqw;background:var(--t);color:#fff;font-weight:800;font-size:12.5cqw;line-height:1.05}
.m-top.long{font-size:10cqw}
.m-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #0005}
.ex{font-family:var(--f-pixel);background:#fff;color:var(--card-ink);border-radius:3px;padding:0 3px;font-size:.8em;line-height:1.25}
.m-art{display:block;height:36%}
.m-art svg,.hc-art svg,.fc-art svg{display:block;width:100%;height:100%}
.m-hp{display:flex;align-items:baseline;gap:2cqw;padding:3cqw 5cqw 0;font-family:var(--f-pixel);font-size:10cqw}
.m-hp b{font-size:18cqw;line-height:1}
.m-bar{margin:2cqw 5cqw 0;height:6cqw;background:#2b2440;padding:1cqw;border-radius:1cqw}
.m-bar i{display:block;height:100%;background:var(--ok)}
.m-bar i.mid{background:var(--warn)}.m-bar i.lo{background:var(--danger)}
.m-en{display:flex;flex-wrap:wrap;gap:2cqw;padding:3cqw 5cqw;margin-top:auto}
.m-en .ei{width:15cqw;height:15cqw}
.dmgc{position:absolute;right:4cqw;top:26%;width:28cqw;height:28cqw;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;
  font-family:var(--f-pixel);font-weight:700;font-size:12cqw;border:2cqw solid #fff;box-shadow:0 1px 3px #0006}
.psn{position:absolute;left:4cqw;top:26%;background:var(--poison);color:#fff;font-family:var(--f-pixel);font-size:8.5cqw;border-radius:3px;padding:1cqw 3cqw;text-transform:uppercase;letter-spacing:.05em}
.psn.para{background:var(--lightning);color:#231a00}
.mini.sel,.hc.sel{outline:3px solid var(--accent);outline-offset:2px}
.mini.tgt{outline:3px dashed var(--accent);outline-offset:3px;animation:pulse .9s steps(2) infinite}
.mini.hit{animation:hit .45s}
@keyframes pulse{50%{outline-offset:6px}}
@keyframes hit{20%{transform:translateX(-6%)}40%{transform:translateX(6%);filter:brightness(2)}60%{transform:translateX(-4%)}80%{transform:translateX(2%)}}

/* hand */
.handwrap{max-width:640px;margin:12px auto 0}
.handwrap .lbl{color:var(--muted)}
.hand{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:thin}
.hand .empty{color:var(--muted);font-size:14px;padding:12px 0}
.hc{container-type:inline-size;flex:none;width:min(23vw,98px);aspect-ratio:63/88;display:flex;flex-direction:column;padding:0;cursor:pointer;text-align:left;
  border:3px solid color-mix(in srgb,var(--t) 70%,#000);border-radius:8px;background:var(--card);color:var(--card-ink);overflow:hidden;box-shadow:0 4px 0 #0007;transition:transform .1s}
.hc:hover{transform:translateY(-4px)}
.hc-kind{font-family:var(--f-round);font-weight:800;font-size:8.5cqw;letter-spacing:.06em;text-transform:uppercase;padding:4cqw 5cqw 0;color:color-mix(in srgb,var(--t) 75%,var(--card-ink))}
.hc-name{font-weight:800;font-size:12.5cqw;line-height:1.05;padding:1cqw 5cqw 3cqw;min-height:2.2em}
.hc-art{display:block;flex:1;min-height:0;background:var(--t-soft)}
.hc-foot{font-family:var(--f-pixel);font-size:10cqw;padding:3cqw 5cqw;display:flex;justify-content:space-between;align-items:center}
.hc-foot .ei{width:14cqw;height:14cqw}

/* energy symbol */
.ei{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--t);flex:none;vertical-align:middle;box-shadow:inset 0 -2px 0 #0003,0 0 0 1.5px #fff8}
.ei svg{width:66%;height:66%;fill:#fff}

/* ---------- full card: one fixed 63:88 face that scales as a unit ---------- */
.fc{container-type:inline-size;width:100%;max-width:340px;margin:0 auto}
.fc-face{aspect-ratio:63/88;width:100%;display:flex;flex-direction:column;gap:2cqw;
  padding:3.6cqw;border-radius:5cqw;border:2.6cqw solid color-mix(in srgb,var(--t) 78%,#1a1530);color:var(--card-ink);overflow:hidden;
  background:linear-gradient(var(--t-soft),var(--card) 38%);box-shadow:0 6px 0 #0008;font-size:4cqw;line-height:1.3}
.fc .ei{width:5.6cqw;height:5.6cqw;box-shadow:inset 0 -1px 0 #0003}
.fc-head{display:grid;gap:.5cqw}
.fc-stage{display:flex;align-items:center;gap:2cqw;min-height:5cqw}
.stage{font-family:var(--f-round);font-weight:800;font-size:3.2cqw;letter-spacing:.08em;text-transform:uppercase;background:var(--card-ink);color:var(--card);border-radius:1cqw;padding:.3cqw 1.6cqw}
.from{font-size:3.3cqw;color:color-mix(in srgb,var(--card-ink) 65%,transparent)}
.fc-title{display:flex;align-items:center;gap:2cqw}
.fc-name{flex:1;min-width:0;font-weight:800;font-size:7cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-hp{font-family:var(--f-pixel);font-weight:700;font-size:7.4cqw;white-space:nowrap}
.fc-hp small{font-size:3.6cqw;margin-right:.6cqw}
.fc-art{flex:none;aspect-ratio:16/9;border-radius:2cqw;overflow:hidden;border:1cqw solid color-mix(in srgb,var(--t) 45%,var(--card));background:var(--t-soft)}
.fc.dense .fc-art{aspect-ratio:2/1}
.fc.dense2 .fc-art{aspect-ratio:12/5}
.fc-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw}
.fc-ability{background:color-mix(in srgb,#b23a48 12%,var(--card));border-radius:2cqw;padding:1.6cqw 2.4cqw;font-size:3.5cqw}
.ab-tag{font-family:var(--f-round);font-weight:800;font-size:3cqw;letter-spacing:.06em;text-transform:uppercase;background:#b23a48;color:#fff;border-radius:1cqw;padding:0 1.4cqw}
.fc-ability p{margin:.6cqw 0 0}
.fc-atk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2cqw;align-items:center;padding-top:1.6cqw;border-top:.5cqw solid var(--card-line)}
.fc-atk:first-child{border-top:0;padding-top:0}
.cost{display:flex;gap:.5cqw;min-width:12cqw}
.atk-main b{font-size:4.8cqw;font-weight:800}
.atk-text{display:block;font-size:3.35cqw;line-height:1.28}
.dmg{font-family:var(--f-pixel);font-weight:700;font-size:7cqw;min-width:2ch;text-align:right}
.fc.dense .atk-text,.fc.dense .fc-ability{font-size:3.1cqw}
.fc.dense2 .atk-text{font-size:2.95cqw}.fc.dense2 .atk-main b{font-size:4.4cqw}
.fc-rule{font-size:3.2cqw;border:.5cqw solid var(--card-line);border-radius:1.6cqw;padding:1.2cqw 2cqw;background:#ffffff80}
.fc.dense2 .fc-rule{font-size:2.9cqw}
.fc-text{margin:0;font-size:4.2cqw;font-weight:700}
.kindpill{font-family:var(--f-round);font-weight:800;font-size:3.2cqw;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--t);border-radius:1cqw;padding:.4cqw 1.8cqw}
.fc-foot{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2cqw;font-size:3.4cqw;border-top:.5cqw solid var(--card-line);padding-top:1.4cqw}
.fc-foot > span{display:flex;flex-direction:column;align-items:flex-start;gap:.4cqw}
.fc-foot small{font-family:var(--f-round);font-weight:800;font-size:2.6cqw;text-transform:uppercase;letter-spacing:.07em;color:color-mix(in srgb,var(--card-ink) 60%,transparent)}
.fc-foot .val{display:flex;gap:.5cqw;align-items:center;font-weight:800}
.fc-trainer-foot{flex:none;font-family:var(--f-round);font-weight:800;font-size:2.8cqw;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--card-ink) 55%,transparent);text-align:center}
.part{border-radius:1.5cqw;transition:opacity .2s,box-shadow .2s}
.focus .part:not([data-hl]){opacity:.35}
[data-hl]{box-shadow:0 0 0 1cqw var(--accent);opacity:1}

/* ---------- inspector ---------- */
.insp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.insp-h b{font-family:var(--f-pixel);font-size:18px;letter-spacing:.04em}
.x{border:2px solid var(--frame);background:var(--win-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;color:var(--ink)}
.acts{display:grid;gap:8px;margin-bottom:12px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:2px solid var(--frame-dim);background:var(--win-2);border-radius:10px;
  padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 #0007}
.act.go{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--win-2))}
.act.go b::before{content:"▶ ";color:var(--accent);font-family:var(--f-pixel)}
.act[disabled]{cursor:not-allowed;opacity:.8;box-shadow:none}
.act .why{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.act b{font-weight:800}
.act .num{font-family:var(--f-pixel);font-weight:700;font-size:20px;white-space:nowrap;color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-bottom:10px;align-items:center}
.status b{color:var(--ink)}
.banner{border-left:4px solid var(--accent);padding:6px 10px;background:#ffd4471a;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.insp-empty p{margin:6px 0 0;color:var(--muted);font-size:14px}
@media (max-width:759px){
  #insp{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:62vh;overflow:auto;border-radius:16px 16px 0 0;border-bottom:0;
    padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  #insp.open{transform:none;visibility:visible;transition:transform .25s ease}
  .app.sheet{padding-bottom:56vh}
  #insp .fc{max-width:300px}
}

/* ---------- anatomy, lobby, setup, gallery ---------- */
.anat{max-width:860px;margin:0 auto}
.anat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.anat-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.anat-grid{grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.parts button{width:100%;text-align:left;display:block;border:2px solid var(--frame-dim);background:var(--win-2);border-radius:10px;padding:7px 10px;cursor:pointer}
.parts button b{display:block;font-size:14px}
.parts button span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.parts button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--win-2))}
.parts button.on b::before{content:"▶ ";color:var(--accent)}
.parts button.absent{opacity:.5}
.lobby{max-width:520px;margin:0 auto;display:grid;gap:12px}
.lobby h2{margin-bottom:0}
.steps{margin:0 0 10px;padding-left:20px;display:grid;gap:6px}
.big-btns{display:grid;gap:10px}
.qr{background:#fff;border-radius:12px;padding:8px;width:100%;max-width:340px;margin:0 auto;border:4px solid var(--frame)}
.qr svg{display:block;width:100%;height:auto}
.alt{border-top:2px dashed var(--frame-dim);padding-top:10px}
.alt summary{cursor:pointer;color:var(--muted);font-size:14px}
.alt p{font-size:14px;margin:10px 0 6px}
.alt textarea{width:100%;height:84px;resize:vertical;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;border:2px solid var(--frame-dim);border-radius:8px;padding:8px;background:var(--win-2);color:var(--ink);word-break:break-all;margin-bottom:8px}
.err{color:var(--danger);font-size:14px;margin:0}
#scan{position:fixed;inset:0;z-index:70;background:#000;display:grid;place-items:center;align-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#scan .scan-box{position:relative;width:min(88vw,420px);aspect-ratio:1;border-radius:18px;overflow:hidden;background:#111}
#scan video{width:100%;height:100%;object-fit:cover;display:block}
#scan .scan-frame{position:absolute;inset:10%;border:3px dashed var(--accent);border-radius:14px;box-shadow:0 0 0 2000px #0007}
#scan p{color:#fff;margin:0;text-align:center}
.screen{max-width:1080px;margin:0 auto}
.screen-h{margin:4px 0 14px}
.screen-h h1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:.04em;margin:0 0 4px;color:var(--accent);
  text-shadow:3px 0 #26124f,-3px 0 #26124f,0 3px #26124f,0 -3px #26124f,0 6px 0 #0006}
.screen-h p{margin:0;color:var(--muted)}
.back{border:0;background:none;color:var(--muted);font-family:var(--f-pixel);letter-spacing:.06em;padding:4px 0;margin-bottom:6px;cursor:pointer}
.sec{font-family:var(--f-pixel);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.decks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.deck{display:flex;flex-direction:column;padding:0;text-align:left;border:3px solid var(--frame-dim);border-radius:12px;overflow:hidden;background:var(--win);cursor:pointer;box-shadow:0 4px 0 #0007}
.deck.on{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-low),0 0 0 3px #ffd44733}
.deck-art{position:relative;aspect-ratio:2/1;background:var(--t-soft)}
.deck-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.deck-body{display:grid;gap:4px;padding:10px 12px 12px}
.deck-body b{display:flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:18px;letter-spacing:.04em}
.deck-body span{font-size:13px;color:var(--muted)}
.diffs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.diff{display:grid;gap:4px;text-align:left;border:3px solid var(--frame-dim);border-radius:12px;padding:12px;background:var(--win);cursor:pointer;box-shadow:0 4px 0 #0007}
.diff b{font-family:var(--f-pixel);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.diff span{font-size:13px;color:var(--muted)}
.diff.on{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-low)}
.diff.on b::before{content:"▶ ";color:var(--accent)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow .chip .ei{width:16px;height:16px}
.start{margin-top:22px;max-width:420px}
.gallery{display:grid;gap:18px 16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:16px}
.gallery figure{margin:0;display:grid;gap:8px;align-content:start}
.gallery .fc{max-width:none}
.gallery figcaption{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--muted);text-align:center}

/* ---------- toast, overlay ---------- */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:60;background:var(--win);color:var(--ink);
  border:3px solid var(--frame);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,460px);box-shadow:0 6px 0 #0008;transition:transform .2s steps(4)}
#toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:50;background:#0b0820cc;display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ov-box{max-width:440px;width:100%;padding:24px;text-align:center}
.ov-box h2{font-size:clamp(34px,9vw,48px);color:var(--accent);text-shadow:3px 0 #26124f,-3px 0 #26124f,0 3px #26124f,0 -3px #26124f,0 6px 0 #0006;margin:6px 0 10px}
.ov-box .goal-btns{justify-content:center}
.art-wrap{position:relative;display:block;width:100%;height:100%}
.art-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
[hidden]{display:none!important}
</style>


</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="ei t-F" id="logo"></span><div>Bench Academy<small>Learn the Pokémon Trading Card Game by playing it</small></div></div>
    <nav id="nav" aria-label="Lessons"></nav>
    <div class="hud-btns" id="hud-btns" hidden><button class="btn ghost" id="sound-btn" data-act="sound">♪ On</button><button class="btn ghost" id="menu-btn" data-act="menu">Menu</button></div>
  </header>
  <section id="menu" hidden></section>
  <div class="layout" id="layout">
    <aside id="lesson" class="panel"></aside>
    <main id="stage"></main>
    <aside id="insp"></aside>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="scan" hidden><div class="scan-box"><video playsinline muted></video><div class="scan-frame"></div></div><p>Point the camera at the code on the other phone.</p><button class="btn ghost" id="scan-cancel">Cancel</button></div>
<div id="ovl"></div>

<script src="vendor/qrcode.min.js"></script>
<script src="vendor/jsQR.min.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>

<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
